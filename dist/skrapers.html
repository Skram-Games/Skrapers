<script>
// SKRAPERS — Stage 13
// Trust: humans noticing they're being investigated and reacting to it —
// the doc's follow-up brainstorm point 2, never built until now. Skrapers
// don't get a suspicion score; this is specifically about the cost of
// surveilling REAL people, which is the doc's whole point in raising it
// ("the player is both investigator and subject" cuts both ways — the
// people being watched are subjects too, not inert data).

(function () {

const suspicion = {}; // acctId -> 0-20
const reacted = {};   // acctId -> "noticed" | "confronted" (highest stage already shown, so it never repeats)

function clamp(n, lo, hi) {
  return Math.max(lo, Math.min(hi, n));
}

// Opening the Investigate panel on a real human is a small, repeatable
// nudge; pinning them to the Case Board (an explicit, deliberate act of
// building a case against a specific person) costs more.
function glance(acctId) {
  suspicion[acctId] = clamp((suspicion[acctId] || 0) + 2, 0, 20);
}
function pin(acctId) {
  suspicion[acctId] = clamp((suspicion[acctId] || 0) + 3, 0, 20);
}
function level(acctId) {
  return suspicion[acctId] || 0;
}

// Called once per return to the feed, against every real human currently
// in the world. Returns the accounts that crossed a NEW threshold this
// tick — "noticed" first (a quiet in-feed reaction, no player choice
// needed), then "confronted" once suspicion climbs further (a direct
// message needing a RESPOND / IGNORE / EXPLAIN choice — see ui/feed.js's
// renderTrustModal). Each account reacts at most once per stage, ever.
function checkReactions(accounts) {
  const events = [];
  accounts.forEach((acct) => {
    if (acct.isSkraper) return;
    const s = suspicion[acct.id] || 0;
    const already = reacted[acct.id];
    if (s >= 12 && already !== "confronted") {
      reacted[acct.id] = "confronted";
      events.push({ acct, stage: "confronted" });
    } else if (s >= 6 && !already) {
      reacted[acct.id] = "noticed";
      events.push({ acct, stage: "noticed" });
    }
  });
  return events;
}

const NOTICED_LINES = [
  "anyone else feel like they're being watched on here lately? weird week.",
  "keep getting this itch that someone's been going through my old posts. probably nothing.",
  "small thing but — noticed the same account keeps turning up on my profile this week. is that even something you can tell? feels like it though.",
  "ok this is going to sound paranoid but has anyone else felt like their feed is being read a bit too closely lately",
];

function noticedPostText() {
  return NOTICED_LINES[Math.floor(Math.random() * NOTICED_LINES.length)];
}

const CONFRONT_LINES = [
  "Hey — this is going to sound strange, but have you been looking into my account? Genuinely just want to know if I'm imagining it.",
  "Weird question, but did you flag me or something? I got a review notice and then noticed you'd been on my profile a lot. Just want to understand what's going on.",
  "Sorry to message out of nowhere. I think you've been looking into me — I don't know why, I haven't done anything. Can you just tell me what's happening?",
];

function confrontMessage() {
  return CONFRONT_LINES[Math.floor(Math.random() * CONFRONT_LINES.length)];
}

// Round 23 (#9): "if the player reaches 0% [community trust] their feed
// begins discussing them and targeting them." Reuses this module's
// existing tone (the "noticed" lines above are the same idea at a lower
// intensity) rather than a third, unrelated system — these read as the
// SAME phenomenon escalated all the way, once the whole community (not
// just one suspicious human) has soured on the player.
const HOSTILE_LINES = [
  "ok has anyone else's account gotten flagged out of nowhere this week? feels targeted honestly",
  "there's someone going through people's profiles digging up nothing, be careful who you engage with",
  "not going to say the account name but you'll know it if it's happened to you too",
  "getting real tired of whoever this is that keeps reporting normal people, hope they see this",
  "my cousin's account got suspended over literally nothing right after this one specific person was on their page",
  "starting a list of everyone this account has gone after, DM me if it happened to you",
];

function hostilePostText() {
  return HOSTILE_LINES[Math.floor(Math.random() * HOSTILE_LINES.length)];
}

function reset() {
  Object.keys(suspicion).forEach((k) => delete suspicion[k]);
  Object.keys(reacted).forEach((k) => delete reacted[k]);
}

function dump() {
  return { suspicion: { ...suspicion }, reacted: { ...reacted } };
}

function load(saved) {
  reset();
  if (!saved) return;
  Object.assign(suspicion, saved.suspicion || {});
  Object.assign(reacted, saved.reacted || {});
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = { glance, pin, level, checkReactions, noticedPostText, confrontMessage, hostilePostText, reset, dump, load };
} else {
  window.SKRAPERS_TRUST = { glance, pin, level, checkReactions, noticedPostText, confrontMessage, hostilePostText, reset, dump, load };
}

})();

</script>

<script>
// SKRAPERS — Stage 13
// Narrative/visual progression (doc sections 32-34): the platform is
// supposed to feel like it's shifting under the player as the
// investigation deepens — MODERN toward OPPRESSIVE, clean blue/white/navy
// toward an amber "M.A.I. influence" look. This computes ONE shared phase
// number (0-4) that ui/feed.js applies as a CSS class on #app (see
// ui/styles.css's .phase-0 .. .phase-4 rules) and that game/horror.js
// scales its glitch frequency against — one driver, two consumers, so the
// visual shift and the horror beats always agree with each other.
//
// Driven by how deep the player is into the investigation (correct
// flags) tempered by how badly it's going for the people around them
// (community trust) — a player who's caught a lot of Skrapers but wrecked
// community trust doing it slides into the oppressive end faster than one
// who's catching just as many cleanly. Deliberately NOT driven by ALGO//
// standing alone — per the doc, staying in ALGO//'s good graces is not
// supposed to read as "things are fine."

(function () {

function computePhase({ correctFlags, communityTrust }) {
  correctFlags = correctFlags || 0;
  communityTrust = typeof communityTrust === "number" ? communityTrust : 100;
  let phase = Math.floor(correctFlags / 3); // one step every 3 clean catches
  if (communityTrust < 70) phase += 1; // the community noticing you costs you a step
  if (communityTrust < 40) phase += 1; // and losing it outright costs another
  return Math.max(0, Math.min(4, phase));
}

const PHASE_LABELS = [
  "ordinary",
  "attentive",
  "watchful",
  "strained",
  "compromised",
];

if (typeof module !== "undefined" && module.exports) {
  module.exports = { computePhase, PHASE_LABELS };
} else {
  window.SKRAPERS_ATMOSPHERE = { computePhase, PHASE_LABELS };
}

})();

</script>

<script>
// SKRAPERS — Stage 13
// Subtle horror (doc section 33): impossible timestamps, a name that
// doesn't look quite right, a notification that knows more than it
// should. Deliberately cosmetic and reversible — a toast/label, never a
// change to real account data other systems depend on — so it reads as
// "did that just happen?" rather than corrupting the investigation. Scaled
// by atmosphere phase (game/atmosphere.js): silent at phase 0, rare at 1,
// increasingly frequent through phase 4.

(function () {

const CHANCE_BY_PHASE = [0, 0.08, 0.16, 0.28, 0.42];

const GLITCHES = [
  { type: "timestamp", text: "SYSTEM: a post in your feed is timestamped 4 hours from now. It's gone by the time you look again." },
  { type: "name", text: "SYSTEM: for a moment, one account's name wasn't the one you remembered. It is now." },
  { type: "notice", text: "SYSTEM: ALGO// surfaced a post it says matches \"topics you've been investigating.\" You didn't search for that." },
  { type: "vanish", text: "SYSTEM: a post you flagged earlier isn't in that account's timeline anymore. Neither is the appeal." },
  { type: "mirror", text: "SYSTEM: your own recent activity briefly appeared in someone else's \"suggested for you.\" It's not there now." },
];

function maybeGlitchEvent(phase) {
  const chance = CHANCE_BY_PHASE[Math.max(0, Math.min(4, phase))] || 0;
  if (Math.random() >= chance) return null;
  return GLITCHES[Math.floor(Math.random() * GLITCHES.length)];
}

// The CAPTCHA's own "kept getting it right" escalation (see ui/feed.js's
// renderCaptchaPass). Reuses this module's tone and mechanism — small,
// reversible unease, never a jump scare or a change to real state —
// instead of inventing a parallel glitch system. Escalates the longer a
// player keeps answering the CAPTCHA "correctly" (which, per the game's
// hook, is the dead end): attempt 1 reads completely normal; 2-3 read
// like an odd, unexplained repeat; 4+ start to sound like the system
// itself doesn't know what to do with someone who keeps passing.
const CAPTCHA_NORMAL = {
  title: "VERIFICATION COMPLETE",
  body: "Correct. Thank you — you may continue as normal.",
  note: "Nothing else happens. There is nothing else here.",
};
const CAPTCHA_UNEASY = [
  { title: "VERIFICATION COMPLETE", body: "Correct. Verifying again, just to be sure.", note: "That wasn't asked of you last time." },
  { title: "STILL VERIFYING", body: "One more time.", note: "It didn't say why." },
];
const CAPTCHA_GLITCH = [
  { title: "VERIFICATION C0MPLETE", body: "Correct. Again.", note: "SYSTEM: this account has now passed four consecutive challenges. No account has ever needed four.", glitch: true },
  { title: "VERIFICATION COMPLETE", body: "Correct. The timestamp on this reads three minutes before you opened the page.", note: "It corrects itself if you look again.", glitch: true },
  { title: "VERIFICATION COMPLETE", body: "Correct. It is starting to ask more slowly than it did the first time.", note: "You have not been asked to leave.", glitch: true },
];

function captchaEscalation(streak) {
  if (streak <= 1) return CAPTCHA_NORMAL;
  if (streak <= 3) return CAPTCHA_UNEASY[Math.floor(Math.random() * CAPTCHA_UNEASY.length)];
  return CAPTCHA_GLITCH[Math.floor(Math.random() * CAPTCHA_GLITCH.length)];
}

// ===========================================================================
// Round 27 (#4): THE SECOND GOTCHA — "unusual sign-in activity".
//
// The CAPTCHA -> Terms trick can only land once: it's the front door. This
// is its later-game sibling, and deliberately a different mechanism. The
// CAPTCHA asked "are you human?" and the Terms screen asked "did you
// read?". This asks the question the whole game has been training the
// player to ask about OTHER accounts — "which of this activity is really
// you?" — and turns it on them, under time pressure.
//
// A security modal lists four recent "sessions" on the player's account.
// Every one of them is built from the player's OWN tracked activity
// (investigations opened, the signal they lean on, a case they worked, an
// account they pinned), and every row carries the same session token —
// the one "issued at verification" (the CAPTCHA). All four are the
// player. The fine print says so, for anyone who reads it. The player is
// asked to confirm which sessions were them before a countdown signs the
// rest out. Disowning any of them — especially quickly — is the tell.
//
// This module owns the content and the judgment; ui/feed.js's
// renderSecurityGotcha owns the DOM and the timer, same split as
// captchaEscalation above and renderCaptchaPass.
// ===========================================================================

const SECURITY_COUNTDOWN_SECONDS = 40;
const SECURITY_READING_WPM = 220; // same reading-speed basis as ui/feed.js's TERMS_READING_WPM
const SECURITY_RUSHED_FACTOR = 0.4; // same "implausibly fast" ratio as the Terms gotcha
const SECURITY_TOKEN = "7F3A-C4PT";

const SECURITY_INTRO =
  "We noticed sign-ins to this account that don't match your usual pattern. Before you continue investigating, confirm which of the sessions below were you. Any session you don't confirm will be signed out, and its activity removed from your record.";

const SECURITY_FINE_PRINT =
  "Session records are compiled only from activity carried by this account's own session token, issued once, at verification. Tokens are never shared between accounts.";

// `ctx` is plain data the UI gathers from the player's real tracked state
// (game/algo.js's profile, gameState, the Case Board) — nothing here reads
// globals, so every line on the list is something the player genuinely did.
function buildSecuritySessions(ctx) {
  const c = ctx || {};
  const sessions = [
    {
      id: "s-current",
      current: true, // can't be signed out from itself — shown as already confirmed
      device: "This browser",
      where: "Current location",
      when: "Active now",
      activity: "Scrolling the Home feed.",
    },
    {
      id: "s-investigations",
      device: "Mobile web",
      where: "Location approximate",
      when: "Earlier today",
      activity: c.investigations
        ? `Opened ${c.investigations} investigation${c.investigations === 1 ? "" : "s"}${c.dominantSignal ? `, mostly checking ${c.dominantSignal}` : ""}.`
        : "Opened several account profiles without investigating any of them.",
    },
    {
      id: "s-case",
      device: "Unrecognised device",
      where: "Location unavailable",
      when: c.caseName ? `During ${c.caseName}` : "Yesterday, late",
      activity: c.formalFlags
        ? `Formally flagged ${c.formalFlags} account${c.formalFlags === 1 ? "" : "s"} as artificial.`
        : "Reviewed a case file and closed it without flagging anyone.",
    },
    {
      id: "s-night",
      device: "Unrecognised device",
      where: "Location unavailable",
      when: "03:14",
      activity: c.pinnedName ? `Viewed ${c.pinnedName}'s profile repeatedly, then pinned it.` : "Viewed the same profile repeatedly, then left without acting.",
    },
  ];
  return sessions.map((s) => ({ ...s, token: SECURITY_TOKEN }));
}

// Mirrors ui/feed.js's TERMS_EXPECTED_MIN_SECONDS: computed from the ACTUAL
// words on screen, not hand-counted, so it never drifts from the copy.
function securityExpectedSeconds(sessions) {
  const words = [SECURITY_INTRO, SECURITY_FINE_PRINT, ...sessions.map((s) => `${s.device} ${s.where} ${s.when} ${s.activity} ${s.token}`)]
    .join(" ")
    .trim()
    .split(/\s+/)
    .filter(Boolean).length;
  return (words / SECURITY_READING_WPM) * 60;
}

// `disowned` = how many (all genuinely the player's) sessions were left
// unconfirmed and so signed out. Returns the reveal copy plus a short
// `trace` line for the Player Profile's paper trail.
function judgeSecurityResponse({ elapsedSeconds, disowned, total, timedOut, expectedSeconds }) {
  const secs = elapsedSeconds.toFixed(1);
  const plural = (n) => (n === 1 ? "" : "s");
  const rushedThreshold = (expectedSeconds || 0) * SECURITY_RUSHED_FACTOR;
  if (disowned === 0) {
    return {
      outcome: "recognised",
      title: "RE-VERIFIED",
      body: `Every session on that list was you — the same token on every row, ${total} different corners of your own week. You recognised all of them. Most accounts disown at least one: it's easier to believe someone else was in here than to remember doing it yourself. ALGO// has noted that you remember.`,
      trace: `Recognised all ${total} of your own sessions (${secs}s)`,
    };
  }
  if (timedOut) {
    return {
      outcome: "timed-out",
      title: "SESSIONS SIGNED OUT",
      body: `You let the clock decide. ${disowned} session${plural(disowned)} — all of them yours, same token, issued to you at the CAPTCHA — ${disowned === 1 ? "was" : "were"} signed out while you were still looking. ALGO// treats hesitation as an answer. It usually is one.`,
      trace: `Let the timer sign out ${disowned} of your own sessions`,
    };
  }
  if (elapsedSeconds < rushedThreshold) {
    return {
      outcome: "rushed",
      title: "SESSIONS SIGNED OUT",
      body: `You signed out ${disowned} session${plural(disowned)} in ${secs} seconds. Every one of them was you — look at the token on each row; it's the one you were issued the day you failed the CAPTCHA. You spend longer than that deciding whether a stranger is real. You decided about yourself without looking.`,
      trace: `Disowned ${disowned} of your own sessions in ${secs}s`,
    };
  }
  return {
    outcome: "disowned",
    title: "SESSIONS SIGNED OUT",
    body: `You took ${secs} seconds, read it through, and still signed out ${disowned} session${plural(disowned)} that ${disowned === 1 ? "was" : "were"} yours. Same token on every row. Sometimes the activity just doesn't look like something you'd do. ALGO// has a word for accounts like that. It's the word you use on the ones you flag.`,
    trace: `Read carefully, still disowned ${disowned} of your own sessions`,
  };
}

const SECURITY_GOTCHA = {
  COUNTDOWN_SECONDS: SECURITY_COUNTDOWN_SECONDS,
  RUSHED_FACTOR: SECURITY_RUSHED_FACTOR,
  INTRO: SECURITY_INTRO,
  FINE_PRINT: SECURITY_FINE_PRINT,
  buildSessions: buildSecuritySessions,
  expectedSeconds: securityExpectedSeconds,
  judge: judgeSecurityResponse,
};

if (typeof module !== "undefined" && module.exports) {
  module.exports = { maybeGlitchEvent, GLITCHES, captchaEscalation, SECURITY_GOTCHA };
} else {
  window.SKRAPERS_HORROR = { maybeGlitchEvent, GLITCHES, captchaEscalation, SECURITY_GOTCHA };
}

})();

</script>

<script>
// SKRAPERS — Stage 13
// In-fiction ALGO// messages to the player (doc sections 20, 39 — "ALGO//
// investigates the player back"). Stage 9 already tracked investigate/flag
// behavior mechanically (game/algo.js) but never surfaced it narratively;
// this is that surface — a notification feed the player can open, with
// messages that reference their OWN tracked stats, not generic flavor
// text. Bookkeeping (which thresholds have already fired) lives here so
// it survives a reload via persist().

(function () {

const state = {
  notified: {}, // milestone key -> true, so each one fires exactly once
  unread: 0,
};

function clamp(n, lo, hi) {
  return Math.max(lo, Math.min(hi, n));
}

// Called after every investigate/flag update. Returns an array of newly
// triggered messages (usually 0 or 1) so the caller can append them to a
// persisted notification list and show a toast for the first one.
function checkTriggers({ investigations, correctFlags, wrongFlags, dominantSignal, accuracy, phase }) {
  const fired = [];

  function fire(key, text) {
    if (state.notified[key]) return;
    state.notified[key] = true;
    state.unread++;
    fired.push({ id: key, text, at: Date.now() });
  }

  if (investigations >= 4) {
    fire(
      "glance-4",
      dominantSignal
        ? `We've noticed you keep coming back to ${dominantSignal}. Most investigators specialize eventually. You're specializing early.`
        : `We've noticed you're opening a lot of profiles without a clear pattern yet. That's normal, early on.`
    );
  }
  if (investigations >= 10 && dominantSignal) {
    fire("glance-10", `You've looked into similar accounts ${investigations} times now, mostly the same way each time. We've adjusted what you'll see next accordingly.`);
  }
  if (correctFlags >= 3) {
    fire("catch-3", `Three correct flags. ALGO// is logging your accuracy — it affects what gets shown to you, and to others who look like you.`);
  }
  if (correctFlags >= 8) {
    fire("catch-8", `Eight. You're better at this than the baseline user by a wide margin. We're curious what that will mean for you.`);
  }
  if (wrongFlags >= 3) {
    fire("wrong-3", `A few of your recent flags didn't hold up on review. The accounts involved know it was you. We don't tell them that — but they can usually tell anyway.`);
  }
  if (typeof accuracy === "number" && accuracy >= 0.85 && correctFlags + wrongFlags >= 5) {
    fire("accuracy-high", `Your flag accuracy is well above the platform average. ALGO// is now treating your judgment as a signal in its own right.`);
  }
  if (phase >= 2) {
    fire("phase-2", `Something you should know: your own activity on this platform is being profiled, the same way you profile everyone else. You knew that. We're telling you anyway.`);
  }
  if (phase >= 4) {
    fire("phase-4", `You've been doing this long enough that the line between investigator and subject isn't really holding anymore. We think you've noticed too.`);
  }

  return fired;
}

// Round 27 (#3): the Home feed's persistent "current focus" line. Same
// voice as the milestone messages above — ALGO// noticing things out loud,
// deniable, never a verdict — but pointed outward at the feed instead of
// at the player. The caller (ui/feed.js's refreshFocusNudge) picks a real,
// still-unflagged Skraper in the live Home world and tells this function
// which of that account's OWN signals is actually loudest (`kind`), so the
// hint points at something genuinely there without ever saying "bot".
// `pairHandle` (optional) names a real neighbor in that account's follow/
// tag graph — usually a human — and switches to a "these two keep turning
// up together" phrasing that is true, useful, and deliberately does not
// say which of the two is the problem. `pick` is the caller's seeded RNG.
const FOCUS_LINES = {
  cadence: [
    "Something about the rhythm of {h}'s posts seems worth a second look.",
    "{h} posts on a schedule most people don't keep. Might be nothing.",
  ],
  activity: [
    "{h} keeps hours we don't usually see. We're only mentioning it.",
    "Something about when {h} is awake seems worth a second look.",
  ],
  linguistic: [
    "{h} sounds exactly the same every time. We noticed; you might want to.",
    "Something about the way {h} phrases things seems worth a second look.",
  ],
  network: [
    "Something about who {h} follows seems worth a second look.",
    "{h} has been quiet. Quiet accounts still follow people. Worth checking who.",
  ],
  pair: [
    "{h} and {p} keep turning up near each other. Probably nothing. Probably.",
    "You haven't looked at {h} or {p} yet. We've noticed you haven't.",
  ],
};

function focusNudgeText({ handle, kind, pairHandle }, pick) {
  const choose = pick || ((list) => list[Math.floor(Math.random() * list.length)]);
  const bank = pairHandle ? FOCUS_LINES.pair : FOCUS_LINES[kind] || FOCUS_LINES.network;
  return choose(bank).split("{h}").join(handle).split("{p}").join(pairHandle || "");
}

// ===========================================================================
// Stage 33: the Marketplace's own persistent line — Home's focus nudge, in
// the same voice, but general rather than aimed: the Marketplace has no one
// "account to look at", so it rotates through standing Skraper-spotting
// reminders instead (ui/feed.js's renderMarketNudge picks the next one on
// every arrival on the grid). It never points at a listing or seller, so it
// can't give anything away — and it keeps running long after the one-time
// Marketplace tour is done.
// ===========================================================================
const MARKET_SPOTTING_LINES = [
  "Read the title, then look at the picture. They should be the same thing. Scroll fast enough and you'll stop checking.",
  "A price that's too good is bait. One that's oddly exact — pennies on a second-hand toaster — was set by something that doesn't haggle.",
  "FREE isn't free if there's a fee underneath it. The small print under the price is where that lives.",
  "Every seller is an account. A join date from last month and nothing else posted is a shop front, not a neighbour.",
  "Sponsored means paid to be seen. That's not a verdict. It's a reason to look twice.",
  "Nobody here needs you to buy anything. Ask whether it's still available, and read how they answer.",
  "One odd listing is just an odd listing. The same seller being odd three times is a pattern.",
];

function marketSpottingText(seq) {
  const n = MARKET_SPOTTING_LINES.length;
  return MARKET_SPOTTING_LINES[(((seq || 0) % n) + n) % n];
}

// Stage 33: the Marketplace's one-off call-outs — the first time a listing
// of a given kind actually scrolls into the player's view. Each fires once,
// ever (game/state.js's tutorial.moments), as an ordinary toast.
const MARKET_MOMENT_LINES = {
  sponsored: "ALGO//: That's your first Sponsored listing. Someone paid for you to see it. Worth asking who — tap through to the seller.",
  freeFee: "ALGO//: FREE, with a fee underneath. Real neighbours giving something away don't usually charge for it.",
};

function marketMomentText(id) {
  return MARKET_MOMENT_LINES[id] || "";
}

// ===========================================================================
// Round 29 (#6): ALGO// PRE-FLAGS — the platform calling one of its own
// accounts suspicious, unprompted, before the player has investigated it.
// Which account, and whether ALGO// is right, is planned per case in
// game/cases.js's secondOpinionsFor (rare: ~1 case in 4 from 003 on, and
// always Case 007). This is only ALGO//'s voice for it — the same clinical,
// deniable register as every other message in this file, never a peer's:
// it doesn't argue, it "assesses"; it doesn't apologise, it "notes". The
// outcome lines are distinct on purpose (ui/feed.js shows each one as its
// own notification/toast, never folded into the ordinary flag result), and
// OVERTURNED — the player proving the platform wrong — is the one ALGO//
// takes least gracefully, because in this game that's the point.
// ===========================================================================
const PREFLAG_LINES = [
  "ALGO// has pre-flagged {h} as a probable Skraper. No action is required from you. We thought you would want to know before you started.",
  "Our models have already assessed {h}: probable Skraper. You are welcome to review it. Most investigators simply agree.",
];

const PREFLAG_OUTCOME_LINES = {
  confirmed: "Your review of {h} matches our pre-flag. We appreciate the agreement. It has been noted that you agreed.",
  "followed-wrong": "{h} has appealed, and the appeal was upheld. Our pre-flag was an assessment, not an instruction. The formal flag was yours.",
  overturned: "Our pre-flag on {h} has been overturned on your evidence. {h} is a real person. This correction has been recorded — about the account, and about you.",
  "contest-failed": "You contested our pre-flag on {h}. Review confirms our original assessment. We did say.",
  stood: "Case closed. Our pre-flag on {h} was never contested and remains on their record. They will not be told why.",
};

function preflagText(handle, pick) {
  const choose = pick || ((list) => list[Math.floor(Math.random() * list.length)]);
  return choose(PREFLAG_LINES).split("{h}").join(handle);
}

function preflagOutcomeText(outcome, handle) {
  return (PREFLAG_OUTCOME_LINES[outcome] || "").split("{h}").join(handle);
}

function reset() {
  state.notified = {};
  state.unread = 0;
}

function markRead() {
  state.unread = 0;
}

function dump() {
  return { notified: { ...state.notified }, unread: state.unread };
}

function load(saved) {
  reset();
  if (!saved) return;
  Object.assign(state.notified, saved.notified || {});
  state.unread = saved.unread || 0;
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = { checkTriggers, focusNudgeText, marketSpottingText, MARKET_SPOTTING_LINES, marketMomentText, preflagText, preflagOutcomeText, reset, markRead, dump, load, state };
} else {
  window.SKRAPERS_ALGOMSGS = { checkTriggers, focusNudgeText, marketSpottingText, MARKET_SPOTTING_LINES, marketMomentText, preflagText, preflagOutcomeText, reset, markRead, dump, load, state };
}

})();

</script>

  ],
},
];

// `agoMinutes` is minutes-in-the-past, not minutes-in-the-future — the
// feed's timeAgo() only handles past timestamps, and thematically the
// chain should read as something that has already unfolded by the time
// the player sees it (per the doc's own "the player experiences the
// event through the feed" framing), not a countdown.
function minutesAgo(mins) {
  return Date.now() - mins * 60 * 1000;
}

// Round 29 (#4): every event post now carries `topicId` (the event's id) so
// the case feed's Timeline view (ui/feed.js) can lay one topic's spread out
// in strict chronological order. Purely a tag — the feed renders these
// posts exactly as before.
function addPost(acct, text, agoMinutes, topicId) {
  acct.posts = acct.posts || [];
  const post = { id: `${acct.id}-event-${acct.posts.length}`, text, timestamp: minutesAgo(agoMinutes) };
  if (topicId) post.topicId = topicId;
  acct.posts.unshift(post);
  acct.posts.sort((a, b) => b.timestamp - a.timestamp);
}

function pickN(list, n) {
  const pool = [...list];
  const picked = [];
  for (let i = 0; i < n && pool.length; i++) {
    picked.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  }
  return picked;
}

// Fires a randomly chosen event against the CURRENT roster: mutates
// accounts in place (adds the announcer as a new inspectable account,
// adds reaction posts to real existing accounts) and returns a summary
// for the UI. An optional eventId picks a specific event (used by
// checkEvents.js so both get exercised in testing).
//
// Round 27: `opts.idSuffix` (optional) replaces the Date.now()-based
// announcer id suffix with a fixed one. A case build (game/cases.js) runs
// under a seeded Math.random so it rebuilds identically every time — the
// retry after a failed attempt, a reload mid-case, the Case Board reading
// a hot-swapped-away case — but a Date.now() suffix still gave the
// announcer a brand-new id on every rebuild, silently orphaning any pin,
// note or formal flag the player had put on that account. Home's own
// auto-events (ui/feed.js's triggerEvent) still omit it and keep the
// timestamp suffix, since those genuinely can fire twice in one world.
function triggerEvent(accounts, eventId, opts) {
  opts = opts || {};
  const EVENT = eventId ? EVENTS.find((e) => e.id === eventId) || EVENTS[0] : EVENTS[Math.floor(Math.random() * EVENTS.length)];
  // Stage 17 bug fix (#2, same class as the worldgen id-collision fix): the
  // announcer's id used to be the event's own fixed id (e.g.
  // "event-skyler-vance"). That's fine the first time an event fires, but
  // `activeEvent` resets to null on every session restore (see ui/feed.js)
  // and this same event could fire again later in the SAME persisted
  // world — pushing a second account with an identical id, the exact
  // symptom (a name/account duplicated in a Connections/followers list)
  // the "Daily Signal Network" bug report described. A per-firing suffix
  // keeps every announcer's id unique even if the same event fires twice.
  const announcerId = opts.idSuffix ? `${EVENT.announcer.id}-${opts.idSuffix}` : `${EVENT.announcer.id}-${Date.now()}-${Math.floor(Math.random() * 1000)}`;
  if (accounts.some((a) => a.id === announcerId)) return null; // (was comparing against the UNsuffixed base id, which no announcer ever has — so this guard could never fire)
  const announcer = { ...EVENT.announcer, id: announcerId, posts: [] };
  if (opts.timeline) return triggerTimelineEvent(accounts, EVENT, announcer);
  addPost(announcer, EVENT.announcementText, 42, EVENT.id); // oldest: the original post

  // Round 23 (#4): a suspended Skraper is gone from the live feed — it
  // shouldn't be able to post a fresh reaction into an event chain either.
  const suspendedCheck = (typeof window !== "undefined" && window.SKRAPERS_STATE && window.SKRAPERS_STATE.isSuspended) || (() => false);
  const humans = accounts.filter((a) => !a.isSkraper);
  const skrapers = accounts.filter((a) => a.isSkraper && !suspendedCheck(a.id));

  const reactors = pickN(humans, Math.min(EVENT.humanReactions.length, humans.length, 6));
  reactors.forEach((acct, i) => addPost(acct, EVENT.humanReactions[i % EVENT.humanReactions.length], 36 - i * 2, EVENT.id));

  const sensational = pickN(skrapers, Math.min(1, skrapers.length));
  sensational.forEach((acct, i) => addPost(acct, EVENT.skraperSensational[i % EVENT.skraperSensational.length], 22 - i * 3, EVENT.id));

  const amplifiers = skrapers.filter((s) => !sensational.includes(s));
  const amplifying = pickN(amplifiers, Math.min(EVENT.skraperAmplify.length, amplifiers.length));
  amplifying.forEach((acct, i) => addPost(acct, EVENT.skraperAmplify[i % EVENT.skraperAmplify.length], 14 - i * 3, EVENT.id));

  const remainingHumans = humans.filter((h) => !reactors.includes(h));
  const arguers = pickN(remainingHumans, Math.min(EVENT.counterArguments.length, remainingHumans.length, 4));
  arguers.forEach((acct, i) => addPost(acct, EVENT.counterArguments[i % EVENT.counterArguments.length], 6 - i, EVENT.id)); // most recent: the pushback

  accounts.push(announcer);

  return {
    topic: EVENT.topic,
    announcer: announcer.name,
    reactionCount: reactors.length,
    sensationalCount: sensational.length,
    amplifyCount: amplifying.length,
    counterCount: arguers.length,
  };
}

// ===========================================================================
// Round 29 (#4): the TIMELINE variant of the same chain — used by the sixth
// case shape (game/cases.js, "timeline"). Same event, same announcer, same
// human reactions and pushback; what changes is that the chain is spread
// over hours instead of minutes and its SHAPE in time is the evidence:
//   - the announcer posts first (T0, ~4-5 hours ago);
//   - real people react at organic, irregular delays scattered across the
//     whole window, a few of them early and loud;
//   - ONE Skraper (the origin) moves the "real story" angle first, fairly
//     early — before most people have even reacted;
//   - every other Skraper repeats the origin's line near-verbatim, each one
//     exactly the same number of minutes after the previous one — a
//     metronome. Nothing about an amplifier's post is sensational on its
//     own; the tell is WHEN it arrived and WHAT it copied;
//   - one or two real people quote the line back to mock it, after the
//     amplifiers — so "posted those words" is not the same as "is one of
//     them", and the Timeline view has to be read, not just filtered.
// Every Skraper in the roster takes part (origin or amplifier) — the case is
// cleared by finding all of them, and they are all on the timeline, among
// a crowd of real people who are also on it.
// ===========================================================================
const TIMELINE_ECHO_FRAMES = [
  (line) => line,
  (line) => `This. ${line}`,
  (line) => `${line} Share this.`,
  (line) => `Read this: ${line}`,
  (line) => `${line} Not staying quiet about it.`,
  (line) => `Saying it again: ${line}`,
];
const TIMELINE_MOCK_FRAMES = [
  (quote) => `seeing "${quote}…" from like five accounts in a row now, all a few minutes apart. ok then`,
  (quote) => `why does every "${quote}…" post today arrive on the same beat. who's scheduling these`,
];

  const suspendedCheck = (typeof window !== "undefined" && window.SKRAPERS_STATE && window.SKRAPERS_STATE.isSuspended) || (() => false);

  const skrapers = accounts.filter((a) => a.isSkraper && !suspendedCheck(a.id) && (a.posts || []).length);
  const T0 = 250 + Math.floor(Math.random() * 60); // minutes ago
  addPost(announcer, EVENT.announcementText, T0, EVENT.id);

  // Real people: scattered, irregular, across the whole window.
  const reactors = pickN(humans, Math.min(EVENT.humanReactions.length, humans.length, 6));
  reactors.forEach((acct, i) => addPost(acct, EVENT.humanReactions[i % EVENT.humanReactions.length], T0 - (4 + Math.floor(Math.random() * (T0 - 20))), EVENT.id));

  const origin = pickN(skrapers, Math.min(1, skrapers.length))[0] || null;
  const line = EVENT.skraperSensational[Math.floor(Math.random() * EVENT.skraperSensational.length)];
  const originAt = T0 - (14 + Math.floor(Math.random() * 16));
  if (origin) addPost(origin, line, originAt, EVENT.id);

  // The metronome: one fixed step for the whole network.
  const step = 6 + Math.floor(Math.random() * 5);
  const lag = 25 + Math.floor(Math.random() * 30); // the first echo waits a while, then the beat starts
  const amplifiers = pickN(skrapers.filter((s) => s !== origin), skrapers.length);
  const frames = pickN(TIMELINE_ECHO_FRAMES, TIMELINE_ECHO_FRAMES.length);
  amplifiers.forEach((acct, i) => {
    const at = Math.max(2, originAt - lag - i * step);
    addPost(acct, frames[i % frames.length](line), at, EVENT.id);
  });
  const lastEchoAt = amplifiers.length ? Math.max(2, originAt - lag - (amplifiers.length - 1) * step) : originAt;

  const remaining = humans.filter((h) => !reactors.includes(h));
  const mockers = pickN(remaining, Math.min(TIMELINE_MOCK_FRAMES.length, remaining.length, amplifiers.length >= 2 ? 2 : 1));
  mockers.forEach((acct, i) => addPost(acct, TIMELINE_MOCK_FRAMES[i % TIMELINE_MOCK_FRAMES.length](quoteOf(line)), Math.max(1, lastEchoAt - 3 - Math.floor(Math.random() * 12)), EVENT.id));
  const arguers = pickN(remaining.filter((h) => !mockers.includes(h)), Math.min(EVENT.counterArguments.length, remaining.length, 3));
  arguers.forEach((acct, i) => addPost(acct, EVENT.counterArguments[i % EVENT.counterArguments.length], 1 + Math.floor(Math.random() * (T0 - 10)), EVENT.id));

  accounts.push(announcer);

    topic: EVENT.topic,
    topicId: EVENT.id,
    announcer: announcer.name,
    timeline: true,
    originId: origin ? origin.id : null,
    stepMinutes: step,
    amplifierIds: amplifiers.map((a) => a.id),
    reactionCount: reactors.length,
    mockCount: mockers.length,
  };
}

  module.exports = { EVENTS, triggerEvent };
} else {
  window.SKRAPERS_EVENTS = { EVENTS, triggerEvent };
}

  "I went and checked — the gaps between those replies are suspiciously even. not saying what it means, just saying.",
];
const WITNESS_SKEPTICS = [
  "people say 'bots' about anything that gets more engagement than they expected",
  "sometimes a post is just popular, not everything is a network",
];

function applyWitnessThread(accounts) {
  const byId = new Map(accounts.map((a) => [a.id, a]));
  const threadSkraper = accounts.find((a) => a.isSkraper && (a.following || []).some((id) => byId.has(id) && !byId.get(id).isSkraper));
  if (!threadSkraper) return null;
  const witness = byId.get(threadSkraper.following.find((id) => byId.has(id) && !byId.get(id).isSkraper));
  const now = Date.now();
  witness.posts = witness.posts || [];
  WITNESS_CLAIMS.forEach((text, i) => {
    witness.posts.push({ id: `${witness.id}-witness-${i}`, text, timestamp: now - (40 - i * 14) * 60000 });
  });
  witness.posts.sort((a, b) => b.timestamp - a.timestamp);
  const others = accounts.filter((a) => !a.isSkraper && a.id !== witness.id);
  const reactions = [...WITNESS_BELIEVERS, ...WITNESS_SKEPTICS];
  reactions.forEach((text, i) => {
    if (!others.length) return;
    const acct = others.splice(Math.floor(Math.random() * others.length), 1)[0];
    acct.posts = acct.posts || [];
    acct.posts.unshift({ id: `${acct.id}-witness-reply-${i}`, text, timestamp: now - (18 - i * 3) * 60000 });
    acct.posts.sort((a, b) => b.timestamp - a.timestamp);
  });
  return witness;
}

// handle, who posts her calls in public before she (or you) can prove them.

// colleague's — quick, confident, a little competitive, capable of saying

// voice (game/algomsgs.js), even though the two mechanics are similar.
// `reasonKind` is the free signal that reads loudest on her target, so she
// always cites something the player can go and look at themselves.
// ===========================================================================
const RIVAL = {
  id: "__rival__",
  name: "Wren Halloway",
  handle: "@halloway_mai",
  title: "M.A.I. field investigator",
};

const RIVAL_CALL_LINES = {
  cadence: [
    "Calling it early: {h}. Look at the gaps between those posts — that's a metronome, not a person. Fairly sure. Not certain. Fairly.",
    "Putting this on the record before anyone else does: {h} posts like it's on a timer. That's our account.",
  ],
  activity: [

    "Going on record: {h}. Nobody's circadian rhythm looks like that. Someone disagree with me.",
  ],
  linguistic: [
    "Read {h}'s posts back to back. Same shape, every time. I think that's one of them — calling it now.",
    "My read on this file: {h}. The wording's too even to be a person having a day. Prove me wrong.",
  ],
};

const RIVAL_STANCE_LINES = {
  agree: "You backed my call on {h} in public. Appreciated. Let's hope we're right — people are watching both of us now.",
  contradict: "Noted — you said in public that I'm wrong about {h}. Fair enough. We'll see whose name ends up looking silly.",
};

// Resolution, from her side, once the review on her target is back.
const RIVAL_RESOLUTION_LINES = {
  right: {
    agree: "Review's back on {n}: Skraper. Good call backing me — and people noticed we agreed.",
    contradict: "Review's back on {n}: Skraper. You said otherwise, in public. No hard feelings. Some, maybe.",
    none: "Review's back on {n}: Skraper. Told you.",
  },
  wrong: {
    agree: "{n} came back a real person. I was wrong — and you backed me in public. That one's on both of us, and they've seen both our names.",
    contradict: "{n} came back a real person, and you said so when I didn't. Fair play. I owe them an apology and you a coffee.",
    none: "{n} came back a real person. I got that one wrong. Happens.",
  },
};

function rivalLine(bank, vars, pick) {
  const list = Array.isArray(bank) ? bank : [bank];
  const choose = pick || ((l) => l[Math.floor(Math.random() * l.length)]);
  return choose(list)
    .split("{h}")
    .join(vars.handle || "")
    .split("{n}")
    .join(vars.name || "");
}

function rivalCallText(reasonKind, handle, pick) {
  return rivalLine(RIVAL_CALL_LINES[reasonKind] || RIVAL_CALL_LINES.cadence, { handle }, pick);
}

function rivalStanceText(stance, handle) {
  return rivalLine(RIVAL_STANCE_LINES[stance] || RIVAL_STANCE_LINES.agree, { handle });
}

function rivalResolutionText(correct, stance, name) {
  const side = RIVAL_RESOLUTION_LINES[correct ? "right" : "wrong"];
  return rivalLine(side[stance] || side.none, { name });
}

window.SKRAPERS_NARRATIVE = { buildOperationCase, buildSleeperCase, buildJournalistCase, applyWitnessThread, RIVAL, rivalCallText, rivalStanceText, rivalResolutionText };

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

  cluster: { tag: "Paid applause", pitch: "Somebody is paying for applause. A ring of accounts in this file keeps lifting each other up — the trick Case 002 caught, run bigger and quieter." },
  viral: { tag: "Something is spreading", pitch: "A story is catching fire faster than people can type. Case 003 taught you to find the spark, not the loudest flame; this fire is wider." },
  witness: { tag: "Someone noticed", pitch: "One real person has noticed something is off and won't stop saying so. Like the journalist in Case 004, they're right about more than they can prove." },
  controller: { tag: "The quiet ones", pitch: "Nobody in this file is saying anything interesting — that's the problem. Like Case 005, the quiet accounts all answer to someone who never posts." },
  sleeper: { tag: "Someone pretending to be boring", pitch: "Somebody here is working hard at being unremarkable. Like Case 006, it passes every content check; its mistake is in who it chose to follow." },
  timeline: { tag: "Out of order", pitch: "The story isn't in what was said, but in when. Put the spread back in order, and the beat gives them away." },
};

function shapeDeck(cycle) {
  const rng = mulberry32(hashSeed(`SKR-CASE-SHAPES-${cycle}`));
  const deck = [...CASE_SHAPES];
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  return deck;
}

// Shape for generated case number `n` (n >= GENERATED_CASE_START).
function shapeForCaseNumber(n) {
  const step = Math.max(0, n - GENERATED_CASE_START);
  const cycle = Math.floor(step / CASE_SHAPES.length);
  const deck = shapeDeck(cycle);
  if (cycle > 0) {
    // Only deck[0]/deck[1] ever get swapped, so the previous deck's LAST
    // entry is always its raw shuffle's last entry — no recursion needed.
    const prevLast = shapeDeck(cycle - 1)[CASE_SHAPES.length - 1];
    if (deck[0] === prevLast) [deck[0], deck[1]] = [deck[1], deck[0]];
  }
  return deck[step % CASE_SHAPES.length];
}

// Per-shape knobs and copy. `step` is 0 for case 008, 1 for 009, ...
// Numbers are tuned per shape rather than shared: a 140-account sleeper
// hunt would be a wall, not a case, so each shape scales along the axis
// that actually makes IT harder.
function shapePlan(shape, step, rng) {
  const plural = (n, one, many) => (n === 1 ? one : many);
  if (shape === "viral") {
    const accountCount = Math.min(120, 34 + step * 5);
    const jitter = Math.min(60, 12 + step * 3);
    const events = window.SKRAPERS_EVENTS.EVENTS;
    const event = events[Math.floor(rng() * events.length)];
    const shown = accountCount + 1; // + the event's announcer, added to the roster by triggerEvent
    return {
      accountCount,
      jitter,
      eventId: event.id,
      briefing: `Something is spiking: ${event.topic} is moving through this ${shown}-account network faster than people type. Trace it back to whoever started it moving — not whoever's loudest about it right now.`,
      detail: `${event.topic} running through ${shown} accounts, and the ones pushing it posting up to ${jitter} minutes off their usual rhythm`,
      tips: [
        "Order matters more than volume — the account that pushed the 'real story' angle FIRST is worth more than the loudest one now.",
        "Near-identical phrasing across different accounts' amplifying posts is the thread to pull.",
        "Real people are in this thread too, arguing both ways — reacting to an event isn't evidence on its own.",
        `${shown} accounts is too many to read cold — use the search bar on the event's own wording to narrow it.`,
      ],
    };
  }
  if (shape === "timeline") {
    // Round 29 (#4): a topic spreads through the network over several hours
    // (game/events.js's triggerTimelineEvent). Every Skraper takes part —
    // one moves the line first, the rest repeat it on a fixed beat — and
    // their own posting cadence is deliberately muddied, so the cadence
    // readout can't do the work: the order and spacing of the topic's
    // posts, read in the case feed's Timeline view, is the evidence.
    const accountCount = Math.min(90, 28 + step * 4);
    const jitter = Math.min(90, 50 + step * 3);
    const amplifiers = Math.min(6, 3 + Math.floor(step / 4));
    const events = window.SKRAPERS_EVENTS.EVENTS;
    const event = events[Math.floor(rng() * events.length)];
    const shown = accountCount + 1;
    return {
      accountCount,
      jitter,
      eventId: event.id,
      timeline: true,
      opts: { skraperTypes: ["amplifier", "echo", "propagator"], skraperCount: amplifiers + 1 },
      briefing: `${event.topic[0].toUpperCase()}${event.topic.slice(1)} broke a few hours ago and has been moving through this ${shown}-account network ever since. Somebody moved a "real story" angle first; ${amplifiers} more accounts have been repeating it since. Their posting rhythm has been scrambled, so cadence won't give them away. Open the Timeline and put the spread back in order — who moved first, and who has been copying, on a beat.`,
      detail: `${event.topic} spreading over several hours, one account moving it and ${amplifiers} more repeating it on a beat, their everyday posting scrambled so it gives nothing away`,
      tips: [
        "Use the case feed's Timeline view, not the Feed — it lays the topic out strictly by time, with the gap before each post.",
        "People react when they happen to look: uneven gaps. A scheduled network reacts on a beat: the same gap, over and over.",
        "Repeating a line and quoting it to mock it look alike in search. Read the posts, and check who said it before the beat started.",
        "Everyone who repeated the line on the beat is part of this. So is whoever said it first.",
      ],
    };
  }
  if (shape === "witness") {
    const accountCount = Math.min(100, 26 + step * 4);
    const jitter = Math.min(60, 18 + step * 3);
    return {
      accountCount,
      jitter,
      opts: { skraperTypes: ["amplifier", "propagator"] },
      witness: true,
      briefing: `Someone in this ${accountCount}-account network has noticed that the replies under their posts arrive on a schedule, and is saying so publicly. Some people believe them, some don't. Work out whether they're right — and find what they've found without knowing it.`,
      detail: `a real person who has half-noticed a ring of repliers, and a crowd split down the middle about whether to believe them`,
      tips: [
        "Read the witness's own posts closely — they're describing a pattern they can't prove yet.",
        "Believers aren't automatically right and skeptics aren't automatically wrong — judge the accounts, not the confidence.",
        "Only one account in the cluster has a thread back to the witness. Check who follows them.",
        "The witness is a real person. Formally flagging them would be exactly the kind of mistake this case is testing for.",
      ],
    };
  }
  if (shape === "controller") {
    const accountCount = Math.min(90, 24 + step * 4);
    const jitter = Math.min(80, 40 + step * 3);
    const clusterSize = Math.min(10, 4 + Math.floor(step / 3));
    const shown = accountCount + 1; // + the silent Controller generateWorld adds in "controller" mode
    return {
      accountCount,
      jitter,
      opts: { skraperFollowMode: "controller", skraperTypes: ["echo", "propagator", "amplifier"], skraperCount: clusterSize },
      briefing: `${clusterSize} accounts in this ${shown}-account network have gone quiet. No sensational posts, no amplification burst, and their posting cadence deliberately muddied. They don't follow each other. They share exactly one connection. Find the controller behind them — in who follows whom, not in what anyone said.`,
      detail: `${clusterSize} quiet accounts wired to one silent account, their posting so irregular that nothing they say will give them away`,
      tips: [
        "Content signals are close to useless here on purpose — don't burn time re-reading posts for tells.",
        "Open Connections on anything that reads even slightly odd, and look for one account they ALL follow.",
        "The controller has never posted. An account with no posts can't be caught by a posting signal — only by who follows it.",
        "Pin the quiet accounts first; the Case Board's red string will show you what they converge on.",
      ],
    };
  }
  if (shape === "sleeper") {
    const accountCount = Math.min(60, 14 + step * 3);
    const sleepers = Math.min(4, 1 + Math.floor(step / 5));
    return {
      accountCount,
      jitter: 0,
      opts: { skraperTypes: ["sleeper"], humanLikeSkrapers: true, skraperFollowMode: "popular", skraperCount: sleepers },
      briefing: `Somewhere in these ${accountCount} accounts ${plural(sleepers, "is one account", `are ${sleepers} accounts`)} built to read like an ordinary person: rare posts, ordinary hours, an ordinary name. The content signals will read low across the board, honestly. Look at who ${plural(sleepers, "it follows", "they follow")} instead.`,
      detail: `${sleepers} impostor${plural(sleepers, "", "s")} with ${plural(sleepers, "an ordinary name", "ordinary names")} hidden among ${accountCount - sleepers} real people, and no clockwork posting to catch`,
      tips: [
        "A sleeper is built to score low on every content signal — a quiet profile is not a clean one.",
        "Check who each suspect follows before you check what they post.",
        "Real people follow their friends and their niche. A sleeper follows whoever makes it look engaged — and nobody follows it back.",
        "Real people are just as quiet as a sleeper here. Every wrongful flag counts against this case.",
      ],
    };
  }
  // cluster (default)
  const accountCount = Math.min(140, 30 + step * 5);
  const jitter = Math.min(70, 15 + step * 4);
  return {
    accountCount,
    jitter,
    briefing: `Somebody is paying for applause. A ring inside this ${accountCount}-account network keeps inflating each other's reach, and its posting rhythm is rougher than Case 002's ever was. No headline event this time — just scale and subtlety working against you together.`,
    detail: `a ring that follows itself, hidden in ${accountCount} accounts, its posting rhythm roughened by up to ${jitter} minutes so the clockwork tell is faint`,
    tips: [
      `${accountCount} accounts is too many to read cold — lean on Investigate and the search bar to narrow candidates before you pin.`,
      "Posting rhythm is rougher here than in any of M.A.I.'s training files — don't treat posting interval as conclusive on its own.",
      "A cluster that inflates each other's reach usually follows each other too. Connections is your tiebreaker.",
      "Pin early and compare signals side by side on the Case Board rather than holding every profile in memory.",
    ],
  };
}

// Builds (deterministically) the definition for generated case number `n`
// (n >= GENERATED_CASE_START). Not cached in CASES — called fresh each
// time getCase()/isGeneratedCaseId() need it.
function buildGeneratedCase(n) {
  const idNum = String(n).padStart(3, "0");
  const id = `case${idNum}`;
  const step = n - GENERATED_CASE_START; // 0, 1, 2, ...
  const shape = shapeForCaseNumber(n);
  const info = SHAPE_INFO[shape];
  const worldId = `SKR-CASE${idNum}-GEN`;
  const rng = mulberry32(hashSeed(worldId));
  const plan = shapePlan(shape, step, rng);
  const difficultyLabel = step < 4 ? "Elevated" : step < 10 ? "Severe" : "Critical";

  const extendedBriefing =
    `${info.pitch} What's in the file: ${plan.detail}. ` +
    `The evidence is sealed — if this file is ever pulled from you, you'll be handed back exactly the same network to try again.`;

  return {
    id,
    name: `Case ${idNum}`,
    difficulty: `${difficultyLabel} · ${info.tag}`,
    briefing: plan.briefing,
    extendedBriefing,
    tips: plan.tips,
    generated: true,
    shape,
    timeline: !!plan.timeline,
    topicId: plan.eventId || null,
    build: () =>
      seededBuild(worldId, () => {
        const world = window.SKRAPERS_WORLDGEN.generateWorld(worldId, plan.accountCount, plan.jitter, plan.opts);
        if (plan.eventId) window.SKRAPERS_EVENTS.triggerEvent(world.accounts, plan.eventId, { idSuffix: id, timeline: !!plan.timeline });
        if (plan.witness) window.SKRAPERS_NARRATIVE.applyWitnessThread(world.accounts);
        return withDeepSignals(id, world.accounts);
      }),
  };
}

function isGeneratedCaseId(id) {
  const m = /^case(\d+)$/.exec(id || "");
  return !!m && parseInt(m[1], 10) >= GENERATED_CASE_START;
}

// The Case Load screen's "next case" order: the 7 authored cases in
// array order, then case008, case009, ... forever. `completedIds` is
// gameState.completedCases (an array of case ids the player has already
// cleared) — this never mutates CASES itself, it just tells the caller
// which case to build/show next.
function nextCaseId(completedIds) {
  const done = new Set(completedIds || []);
  const authored = CASES.find((c) => !done.has(c.id));
  if (authored) return authored.id;
  let n = GENERATED_CASE_START;
  while (done.has(`case${String(n).padStart(3, "0")}`)) n++;
  return `case${String(n).padStart(3, "0")}`;
}

function getCase(id) {
  const authored = CASES.find((c) => c.id === id);
  if (authored) return authored;
  if (isGeneratedCaseId(id)) {
    const n = parseInt(/^case(\d+)$/.exec(id)[1], 10);
    return buildGeneratedCase(n);
  }
  return CASES[0];
}

// ===========================================================================
// Round 29 (#5, #6): SECOND OPINIONS — two other voices that call a suspect
// before the player has necessarily reached a conclusion, planned here per
// case attempt so a retry (same deterministic roster) hears the same calls.
//
//   RIVAL (#5) — Wren Halloway, another M.A.I. field investigator working
//   the same file (game/narrative.js holds her voice). She reads the
//   SURFACE: her pick, right or wrong, is whichever account's free signals
//   (cadence / activity hours / wording) read loudest, and her public post
//   says which. She turns up in a little over half of the cases from 002
//   on (RIVAL_CASE_CHANCE), and is right RIVAL_ACCURACY (65%) of the time —
//   a peer worth listening to, not an oracle.
//
//   ALGO// PRE-FLAG (#6) — the platform flagging one of its own accounts,
//   unprompted, before the player has looked. Rare by design: roughly one
//   case in four from 003 on (PREFLAG_CASE_CHANCE), and ALWAYS in Case 007,
//   the file whose whole brief is pointing the tools at ALGO// itself. ALGO//
//   reads the DEEP records (it owns them): when it's wrong, it's wrong the
//   way a model trained on those records would be — it most often lands on
//   a red herring (simulation/worldgen.js), a real person whose server
//   records genuinely look like a Skraper's. Right PREFLAG_ACCURACY (60%) of
//   the time — trusting it blindly loses about two cases in five.
//
// Calibration note (judgment call): both sit in the 60-65% band the brief
// asked for — right more often than not, wrong often enough that following
// either without checking is a real mistake. The rival is a touch more
// reliable than ALGO// on purpose: she's a peer reading the evidence you
// can see; ALGO// is an interested party grading its own platform.
// Never the same target for both. Never an event announcer (a public figure
// who only posted one announcement), never the player.
// ===========================================================================
const RIVAL_CASE_CHANCE = 0.55;
const RIVAL_ACCURACY = 0.65;
const PREFLAG_CASE_CHANCE = 0.3;
const PREFLAG_ACCURACY = 0.6;
const PREFLAG_ALWAYS = ["case007"];
// Round 30 (#2, progressive unlocking): Case 001 is every player's first
// case — Case Load always serves it first (nextCaseId), and it's where the
// guided walkthrough runs — so neither second opinion ever plans there:
// both reward already understanding the basics. Halloway unlocks from 002,
// ALGO//'s pre-flag from 003, exactly as before. (These lists predate Round
// 30; it verified them rather than adding a parallel gate. Simplified Mode's
// hide-both switch lives at the display/fire layer in ui/feed.js, not here,
// so the per-attempt PLAN stays deterministic whichever way it's set.)
const RIVAL_NEVER = ["case001"];
const PREFLAG_NEVER = ["case001", "case002"];
const LEVEL_SCORE = { high: 2, medium: 1, low: 0 };
const SURFACE_KIND = { "Posting cadence": "cadence", "Activity-hour pattern": "activity", "Linguistic consistency": "linguistic" };

function surfaceRead(acct) {
  const INV = window.SKRAPERS_INVESTIGATE;
  let score = 0;
  let kind = null;
  let best = -1;
  INV.computeSignals(acct).forEach((s) => {
    const v = LEVEL_SCORE[s.level] || 0;
    score += v;
    if (v > best) {
      best = v;
      kind = SURFACE_KIND[s.label] || "cadence";
    }
  });
  return { score, kind: best > 0 ? kind : "cadence" };
}

function deepHighCount(acct, accounts) {
  const INV = window.SKRAPERS_INVESTIGATE;
  const followers = accounts.filter((o) => (o.following || []).indexOf(acct.id) !== -1).map((o) => o.id);
  return INV.computeDeepSignals(acct, followers).filter((s) => s.level === "high").length;
}

function secondOpinionsFor(caseId, accounts) {
  const rng = mulberry32(hashSeed(`${caseId}|second-opinions`));
  // Fixed draw shape, so a change to one decision never reshuffles another.
  const rollRival = rng();
  const rivalRight = rng() < RIVAL_ACCURACY;
  const rollFlag = rng();
  const flagRight = rng() < PREFLAG_ACCURACY;
  const pickA = rng();
  const pickB = rng();

  const live = (accounts || []).filter((a) => a && a.id !== "__player__" && !/^event-/.test(a.id) && (a.posts || []).length);
  const skrapers = live.filter((a) => a.isSkraper);
  const humans = live.filter((a) => !a.isSkraper);
  const at = (list, r) => (list.length ? list[Math.floor(r * list.length)] : null);
  const out = { rival: null, preflag: null };

  const rivalOn = RIVAL_NEVER.indexOf(caseId) === -1 && rollRival < RIVAL_CASE_CHANCE;
  if (rivalOn && skrapers.length && humans.length) {
    let target;
    if (rivalRight) {
      target = at(skrapers, pickA);
    } else {
      // Wrong the way a surface read goes wrong: the loudest-looking person.
      const ranked = humans.map((a) => ({ a, s: surfaceRead(a).score })).sort((x, y) => y.s - x.s || (x.a.id < y.a.id ? -1 : 1));
      target = at(ranked.slice(0, 3).map((r) => r.a), pickA);
    }
    if (target) out.rival = { acctId: target.id, correct: !!target.isSkraper, reasonKind: surfaceRead(target).kind };
  }

  const flagOn = PREFLAG_NEVER.indexOf(caseId) === -1 && (PREFLAG_ALWAYS.indexOf(caseId) !== -1 || rollFlag < PREFLAG_CASE_CHANCE);
  if (flagOn && skrapers.length && humans.length) {
    const taken = out.rival ? out.rival.acctId : null;
    let target;
    if (flagRight) {
      target = at(skrapers.filter((a) => a.id !== taken), pickB);
    } else {
      const herrings = humans.filter((a) => a.id !== taken && a.deep && a.deep.herring);
      if (herrings.length) target = at(herrings, pickB);
      else {
        const ranked = humans.filter((a) => a.id !== taken).map((a) => ({ a, s: deepHighCount(a, accounts) })).sort((x, y) => y.s - x.s || (x.a.id < y.a.id ? -1 : 1));
        target = at(ranked.slice(0, 3).map((r) => r.a), pickB);
      }
    }
    if (target) out.preflag = { acctId: target.id, correct: !!target.isSkraper };
  }
  return out;
}

// ===========================================================================
// Stage 32 (#7): MARKETPLACE HOOKS. A case definition may carry an optional
//   marketplace: { sellerId, briefing }
// — `sellerId` an account id in that case's own roster, `briefing` one line
// pointing the player at the Marketplace (shown on the case brief and on
// Case Load, never naming the seller). While that case is the live world,
// its Marketplace (game/marketplace.js) guarantees one sponsored, suspicious
// listing from that seller, near the top of the grid, that doesn't sell out
// from under the player until the case is cleared. Anything without the
// field is untouched. Not a new case shape (that's future scope) — just
// enough for a case to send the player shopping for evidence.
// ===========================================================================
function marketplaceHookFor(caseId) {
  const def = getCase(caseId);
  return def && def.id === caseId && def.marketplace && def.marketplace.sellerId ? def.marketplace : null;
}

window.SKRAPERS_CASES = { marketplaceHookFor, CASES, getCase, isGeneratedCaseId, nextCaseId, GENERATED_CASE_START, CASE_SHAPES, shapeForCaseNumber, hintShapeFor, caseHint, MAX_HINTS_PER_ATTEMPT, secondOpinionsFor, RIVAL_ACCURACY, PREFLAG_ACCURACY };

})();

</script>

<!-- ===== game/persist.js ===== -->
<script>
// SKRAPERS — Stage 12 (persistence)
// A thin localStorage wrapper so the game survives a reload: credibility,
// flagged accounts, which case/world is loaded, pinned case-board ids,
// the adaptive algo's profile, and whether the CAPTCHA intro has been
// seen. Every read and write is wrapped per the artifact platform's own
// storage guidance (browser storage can come back empty or throw — a
// private window, cleared site data, a first load) — the game must
// render correctly either way, so persistence is treated as a bonus
// layer, never a requirement.
//
// Deliberately NOT persisting the full generated account roster/posts —
// only enough to REBUILD the right world (the case id, or the procedural
// seed + account count) via the exact same generators Stage 6 already
// made deterministic. Storing the whole roster would work too, but would
// desync from any future change to a case's own definition; rebuilding
// from the seed is the same reproducibility principle Stage 6 already
// established ("NO TWO INTERNETS ARE THE SAME" — but the SAME internet,
// same seed, always comes back the same).

(function () {

const KEY = "skrapers.save.v1";

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) {
    return null; // corrupted, blocked, or unavailable storage — fall back to a fresh session
  }
}

function save(data) {
  try {
    localStorage.setItem(KEY, JSON.stringify(data));
    return true;
  } catch (e) {
    return false; // private window, quota, or storage disabled — game keeps working in-memory
  }
}

function clear() {
  try {
    localStorage.removeItem(KEY);
    return true;
  } catch (e) {
    return false;
  }
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = { load, save, clear, KEY };
} else {
  window.SKRAPERS_PERSIST = { load, save, clear, KEY };
}

})();

</script>

<script>
// SKRAPERS — Stage 15 (navigation/gameplay IA redesign)
// Leads — organic follow-up threads opened while playing Home, not a
// pre-listed mission log. Exactly two triggers open a new lead (see
// ui/feed.js): (a) correctly flagging a real Skraper account from the
// feed, and (b) discovering — via the Connections panel — that two
// HIGH-signal accounts are linked. Both triggers are independent, not a
// sequential chain, and pursuing a lead further is entirely the player's
// choice; nothing here forces a follow-up. Follows game/reputation.js's
// plain-object-state pattern.

(function () {

const state = {
  leads: [], // { id, trigger, accountIds, discoveredAt, pursued, dismissed }
};
let nextId = 1;

function clamp(n, lo, hi) {
  return Math.max(lo, Math.min(hi, n));
}

// Dedupe key so the same flag or the same connection pair never opens a
// second lead — re-flagging the same account, or revisiting the same
// Connections panel, shouldn't spam the notification feed.
function keyFor(trigger, accountIds) {
  return `${trigger}:${[...accountIds].slice().sort().join(",")}`;
}

function addLead(trigger, accountIds, extra) {
  const key = keyFor(trigger, accountIds);
  if (state.leads.some((l) => l.key === key)) return null;
  const lead = Object.assign(
    {
      id: `lead-${nextId++}`,
      key,
      trigger, // "flag" | "connection"
      accountIds: [...accountIds],
      discoveredAt: Date.now(),
      pursued: false,
      dismissed: false,
    },
    extra || {}
  );
  state.leads.unshift(lead);
  return lead;
}

function markPursued(id) {
  const lead = state.leads.find((l) => l.id === id);
  if (lead) lead.pursued = true;
}

function markDismissed(id) {
  const lead = state.leads.find((l) => l.id === id);
  if (lead) lead.dismissed = true;
}

function openLeadsCount() {
  return state.leads.filter((l) => !l.pursued && !l.dismissed).length;
}

function dump() {
  return { leads: state.leads, nextId };
}

function load(saved) {
  if (saved && Array.isArray(saved.leads)) {
    state.leads = saved.leads;
    nextId = typeof saved.nextId === "number" ? saved.nextId : state.leads.length + 1;
  } else {
    state.leads = [];
    nextId = 1;
  }
}

function reset() {
  state.leads = [];
  nextId = 1;
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = { state, addLead, markPursued, markDismissed, openLeadsCount, dump, load, reset };
} else {
  window.SKRAPERS_LEADS = { state, addLead, markPursued, markDismissed, openLeadsCount, dump, load, reset };
}

})();

</script>
