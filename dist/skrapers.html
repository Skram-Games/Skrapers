const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

// Same logic as accounts.js's pickActiveMinsAgo — duplicated rather than
// cross-file-coupled, so this generator has no load-order dependency on
// accounts.js.
function pickActiveMinsAgo(activeHours, maxDaysBack) {
  const [start, end] = activeHours;
  const spanHours = end > start ? end - start : 24 - start + end;
  for (let attempt = 0; attempt < 20; attempt++) {
    const daysBack = Math.floor(Math.random() * maxDaysBack);
    const hourOffset = Math.random() * spanHours;
    const hourOfDay = (start + hourOffset) % 24;
    const now = new Date();
    const candidate = new Date(now);
    candidate.setDate(now.getDate() - daysBack);
    candidate.setHours(Math.floor(hourOfDay), Math.floor(Math.random() * 60), 0, 0);
    const minsAgo = Math.round((now - candidate) / 60000);
    if (minsAgo > 0) return minsAgo;
  }
  return Math.floor(Math.random() * maxDaysBack * 24 * 60);
}

// Round 27 (#5, case SHAPE rotation — see game/cases.js's
// buildGeneratedCase): optional `opts` let a caller build a world whose
// Skraper network has a different SHAPE, reusing the exact mechanisms the
// hand-authored cases already proved rather than new detection mechanics.
// Every knob is opt-in; with no `opts` the RNG is consumed in exactly the
// same order as before, so every existing seed (Case 002, Case 007, every
// Home world and Home batch) generates byte-for-byte what it always has.
//   skraperCount        — override the default ~7% cluster size.
//   skraperTypes        — restrict which archetypes the cluster draws from
//                         (e.g. ["sleeper"] for a Case 006-style case).
//   humanLikeSkrapers   — give Skrapers ordinary person names/handles/join
//                         dates instead of the "_official" outlet names
//                         (Case 006's Nina Aldworth, generalized).
//   skraperFollowMode   — "cluster" (default: they all follow each other,
//                         one also follows the most popular human),
//                         "controller" (Case 005: they follow ONLY a silent
//                         Controller account that never posts, and not each
//                         other), or "popular" (Case 006: each follows only
//                         the most popular human; nothing follows back).
function generateWorld(worldId, accountCount, jitterMinutes, opts) {
  accountCount = accountCount || 36;
  jitterMinutes = jitterMinutes || 0; // Stage 8 difficulty knob — see accounts.js for the rationale
  opts = opts || {};
  const followMode = opts.skraperFollowMode || "cluster";
  const rng = mulberry32(hashSeed(worldId));
  const originalRandom = Math.random;
  Math.random = rng; // see file header

  try {
    const { HUMAN_PERSONALITIES, SKRAPER_TYPES } = window.SKRAPERS_PERSONALITIES;
    const { generatePost, generateAdPost, generatePromoPost, generateBio } = window.SKRAPERS_GENERATE;
    const all = { ...HUMAN_PERSONALITIES, ...SKRAPER_TYPES };
    const now = Date.now();

    // A small discoverable cluster, not one isolated account — per the
    // doc's ACCOUNT → PATTERN → CLUSTER → NETWORK structure (section 13).
    const skraperCount = typeof opts.skraperCount === "number" ? Math.max(1, Math.min(accountCount - 2, Math.round(opts.skraperCount))) : Math.max(2, Math.round(accountCount * 0.07));
    const humanCount = accountCount - skraperCount;

    const usedNames = new Set();
    function uniqueName() {
      let name, tries = 0;
      do {
        name = `${FIRST_NAMES[Math.floor(Math.random() * FIRST_NAMES.length)]} ${LAST_NAMES[Math.floor(Math.random() * LAST_NAMES.length)]}`;
        tries++;
      } while (usedNames.has(name) && tries < 50);
      usedNames.add(name);
      return name;
    }
    function handleFor(name) {
      const base = name.toLowerCase().replace(/[^a-z]/g, "");
      const suffix = Math.floor(Math.random() * 900 + 100);
      return "@" + base.slice(0, 12) + (Math.random() < 0.4 ? suffix : "");
    }

    // Stage 17 bug fix (#2): ids used to be scoped only to THIS call
    // ("w0", "ws1", ...), which was fine for a one-shot case build but
    // collided across Home's infinite-scroll batches — loadMoreIntoFeed()
    // calls generateWorld() again for every new batch, each restarting its
    // own numbering from 0, so "ws1" from batch 3 was a genuinely
    // different account object than "ws1" from batch 7, yet shared an id
    // (and, since skraperNames[1] is always "Daily Signal Network"
    // regardless of seed, often the same NAME too). That made the same
    // account id resolve to multiple different objects at once —
    // surfacing as the same name appearing twice in a Connections list
    // (followersOf() legitimately matches every account whose `following`
    // includes that id, and there were now two of them). Prefixing every
    // id with this call's own worldId (already unique per batch) makes
    // ids globally unique again without touching anything downstream that
    // just treats ids as opaque strings.
    const idPrefix = `${worldId}-`;
    const roster = [];
    // Feature round (fake ads + human small-business counterpart): ~12% of
    // human slots become the small_biz personality (a real person running
    // a small business/homemade/advice thing out of their own life — see
    // data/personalities.js), plus one FORCED small_biz account per world/
    // batch so a promo post is always reliably reachable, not left to
    // chance on a small batch. Small-biz humans get a genuinely small
    // follower count (a handful, not thousands) per the design's own
    // "reads as authentically human, small-scale" requirement.
    const forcedSmallBizIdx = humanCount > 0 ? Math.floor(Math.random() * humanCount) : -1;
    const SMALL_BIZ_CHANCE = 0.12;
    for (let i = 0; i < humanCount; i++) {
      const isSmallBiz = i === forcedSmallBizIdx || Math.random() < SMALL_BIZ_CHANCE;
      const key = isSmallBiz ? "small_biz" : HUMAN_KEYS[Math.floor(Math.random() * HUMAN_KEYS.length)];
      const name = uniqueName();
      roster.push({
        id: `${idPrefix}w${i}`,
        name,
        handle: handleFor(name),
        personalityKey: key,
        isSkraper: false,
        isSmallBiz,
        followers: isSmallBiz ? Math.floor(Math.random() * 180) + 15 : Math.floor(Math.random() * 3000) + 20,
        joined: `${MONTHS[Math.floor(Math.random() * 12)]} ${2017 + Math.floor(Math.random() * 8)}`,
      });
    }
    // Stage 12: draw from every Skraper archetype defined in
    // personalities.js, not just Echo — a procedural world now mixes
    // whichever ones exist there, so this generator automatically picks
    // up new archetypes without needing its own edit each time one is
    // added.
    const skraperNames = ["Verified Voice", "Daily Signal Network", "TrueTake", "PulseWire", "ClearFeed", "OpenLine"];
    const restrictedTypes = Array.isArray(opts.skraperTypes) ? opts.skraperTypes.filter((k) => SKRAPER_TYPES[k]) : [];
    const skraperTypeKeys = restrictedTypes.length ? restrictedTypes : Object.keys(SKRAPER_TYPES);
    // Feature round (fake ads): one skraper slot per world/batch is FORCED
    // to the adbot archetype, same reliability reasoning as small_biz above
    // — a sponsored post should be a dependable thing a player (and a test)
    // can find, not a rare roll, while every other skraper slot still draws
    // normally from the full archetype pool.
    const forcedAdbotIdx = skraperTypeKeys.includes("adbot") && skraperCount > 0 ? Math.floor(Math.random() * skraperCount) : -1;
    for (let i = 0; i < skraperCount; i++) {
      const personalityKey = i === forcedAdbotIdx ? "adbot" : skraperTypeKeys[Math.floor(Math.random() * skraperTypeKeys.length)];
      if (opts.humanLikeSkrapers) {
        // Round 27: a Skraper built to pass as a person — same name/handle
        // generator and the same modest follower/join-date ranges real
        // humans in this world get, so nothing about the account's surface
        // separates it from the crowd (the Case 006 design, generalized).
        const personName = uniqueName();
        roster.push({
          id: `${idPrefix}ws${i}`,
          name: personName,
          handle: handleFor(personName),
          personalityKey,
          isSkraper: true,
          isAdAccount: personalityKey === "adbot",
          followers: Math.floor(Math.random() * 900) + 60,
          joined: `${MONTHS[Math.floor(Math.random() * 12)]} ${2021 + Math.floor(Math.random() * 4)}`,
        });
        continue;
      }
      const name = skraperNames[i % skraperNames.length] + (i >= skraperNames.length ? ` ${i}` : "");
      roster.push({
        id: `${idPrefix}ws${i}`,
        name,
        handle: "@" + name.toLowerCase().replace(/\s+/g, "_") + "_official",
        personalityKey,
        isSkraper: true,
        isAdAccount: personalityKey === "adbot",
        followers: Math.floor(Math.random() * 40000) + 5000,
        joined: "Jan 2026",
      });
    }

    // Relationships: humans follow 1-3 peers, biased toward their own
    // personality type first (a community), falling back to anyone.
    roster.forEach((acct) => {
      if (acct.isSkraper) return;
      const samePersonality = roster.filter((a) => !a.isSkraper && a.personalityKey === acct.personalityKey && a.id !== acct.id);
      const pool = samePersonality.length ? [...samePersonality] : roster.filter((a) => a.id !== acct.id && !a.isSkraper);
      const n = 1 + Math.floor(Math.random() * 3);
      const following = [];
      for (let k = 0; k < n && pool.length; k++) {
        const idx = Math.floor(Math.random() * pool.length);
        following.push(pool.splice(idx, 1)[0].id);
      }
      acct.following = following;
    });

    // The Skraper cluster follows each other (the "pattern" a player
    // finds first), and exactly one of them also follows the single most
    // popular human account — the thread that pulls the investigation
    // out of the cluster and into the real social graph.
    const skraperAccts = roster.filter((a) => a.isSkraper);
    const popularHuman = roster.filter((a) => !a.isSkraper).sort((a, b) => b.followers - a.followers)[0];
    const controllerId = `${idPrefix}ctrl`;
    skraperAccts.forEach((s, idx) => {
      if (followMode === "controller") {
        s.following = [controllerId]; // Case 005: no cluster links at all — only the shared silent account
        return;
      }
      if (followMode === "popular") {
        s.following = popularHuman ? [popularHuman.id] : []; // Case 006: one opportunistic out-link, nothing reciprocal
        return;
      }
      const others = skraperAccts.filter((o) => o.id !== s.id).map((o) => o.id);
      s.following = idx === 0 && popularHuman ? [...others, popularHuman.id] : others;
    });

    roster.forEach((acct) => {
      const p = all[acct.personalityKey];
      // Sleeper is the one Skraper archetype built to defeat cadence
      // itself (see personalities.js) — mechanically-regular posting
      // would undercut its whole design, so it gets a low, irregular post
      // count like a real quiet human rather than the other archetypes'
      // clockwork interval.
      const isSleeper = acct.personalityKey === "sleeper";
      // Stage 13: archetypes the player has repeatedly caught get extra
      // jitter on top of the case/world's own difficulty knob — see
      // game/algo.js's counterPlayJitter(). window.SKRAPERS_ALGO may not
      // exist yet in a pure Node test context, so this degrades to 0 there.
      const counterJitter =
        acct.isSkraper && window.SKRAPERS_ALGO ? window.SKRAPERS_ALGO.counterPlayJitter(acct.personalityKey) : 0;
      const effectiveJitter = (jitterMinutes || 0) + counterJitter;
      const postCount = acct.isSkraper ? (isSleeper ? 2 + Math.floor(Math.random() * 2) : 5 + Math.floor(Math.random() * 3)) : 3 + Math.floor(Math.random() * 4);
      const posts = [];
      // Feature round: which of this account's posts (if any) become a
      // sponsored ad or an organic small-biz promo post. Kept to a minority
      // of an eligible account's own posts (not literally every post) so
      // an ad/promo account's feed still reads like a real timeline rather
      // than a wall of pitches — the density target across the WHOLE feed
      // (roughly 1 in 8-15 posts, tunable here) comes from combining a
      // guaranteed-present account (forcedAdbotIdx/forcedSmallBizIdx above)
      // with a moderate per-post chance, not from every post of that
      // account being tagged.
      const isAdbot = acct.personalityKey === "adbot";
      const isSmallBiz = acct.personalityKey === "small_biz";
      for (let i = 0; i < postCount; i++) {
        const minsAgo =
          acct.isSkraper && !isSleeper
            ? Math.max(0, i * 47 + (effectiveJitter ? Math.round((Math.random() * 2 - 1) * effectiveJitter) : 0))
            : pickActiveMinsAgo(p.activeHours, 6);
        let text;
        const extra = {};
        // The account's very FIRST post is always the special one (when
        // eligible) so a guaranteed-present ad/small-biz account reliably
        // surfaces a sponsored/promo post rather than leaving it to chance
        // on accounts with few posts; later posts roll independently.
        if (isAdbot && (i === 0 || Math.random() < 0.55)) {
          const categories = p.productCategories || ["gadget"];
          const ad = generateAdPost(categories[Math.floor(Math.random() * categories.length)], p);
          text = ad.text;
          extra.postType = "ad";
          extra.imageStyle = ad.imageStyle;
          extra.adCategory = ad.category;
          extra.sponsorAcctId = acct.id;
        } else if (isSmallBiz && (i === 0 || Math.random() < 0.35)) {
          text = generatePromoPost(p);
          extra.postType = "promo";
          extra.imageStyle = "photo";
        } else {
          text = generatePost(acct.personalityKey, p);
        }
        posts.push({ id: `${acct.id}-p${i}`, text, timestamp: now - minsAgo * 60000, ...extra });
      }
      posts.sort((a, b) => b.timestamp - a.timestamp);
      acct.personalityLabel = p.label;
      acct.posts = posts;
      // Feature round ("every profile needs a bio"): deterministic per the
      // world's own seeded RNG (Math.random is scoped to `rng` for this
      // whole generateWorld call — see file header), so the same world ID
      // always produces the same bio for the same account.
      acct.bio = generateBio(acct.personalityKey, p);
    });

    // Item 8: people tagging others in their posts — a modest fraction of
    // posts (not every one, so it stays a discoverable signal rather than
    // noise) get an "@handle" mention of another account in this same
    // world appended to the text. `post.mentionsAcctId` is what makes the
    // mention clickable and discoverable in ui/feed.js (renderPost's
    // mention span, renderConnectionsPanel's tag list) — it "sheds light
    // on their network" the same honest way follow relationships already
    // do, just from post content instead of the follow graph.
    const MENTION_CHANCE = 0.2;
    if (roster.length > 1) {
      roster.forEach((acct) => {
        acct.posts.forEach((post) => {
          if (Math.random() >= MENTION_CHANCE) return;
          const candidates = roster.filter((a) => a.id !== acct.id);
          const target = candidates[Math.floor(Math.random() * candidates.length)];
          post.text = `${post.text} ${target.handle}`;
          post.mentionsAcctId = target.id;
        });
      });
    }

    // Round 27: the Controller itself (Case 005's "Unnamed Account",
    // generalized) — added after the post and mention passes on purpose,
    // so it has no posts, is never @-tagged, and never tags anyone: the
    // only thing that can find it is the follow graph.
    if (followMode === "controller") {
      roster.push({
        id: controllerId,
        name: "Unnamed Account",
        handle: "@" + "x".repeat(3) + Math.floor(1000 + Math.random() * 9000),
        personalityKey: "echo",
        personalityLabel: "No posting history",
        isSkraper: true,
        followers: 2 + Math.floor(Math.random() * 6),
        joined: "unknown",
        following: [],
        posts: [],
        bio: "",
      });
    }

    // Round 29 (#2): red herrings — a deliberate minority of REAL people who
    // trip the same signals a Skraper does, for mundane reasons. Selected and
    // (for the post-level traits) applied here, BEFORE the deep records are
    // built, so every deep record's quoted snippets see the final post text;
    // the deep-level traits (timezone/photo/engagement) are applied by
    // attachDeepSignals itself from the plan this leaves on each account.
    // Own per-account PRNG, like the deep records — the world RNG stream is
    // untouched.
    applyRedHerrings(roster, "");

    // Round 28: every account's deep-investigate record (location, session
    // log, image matches, server record, engagement history). Runs on its
    // OWN per-account PRNG, after everything above, so the world RNG stream
    // above is consumed exactly as before — every existing seed still
    // generates the same accounts, posts and graph byte-for-byte.
    attachDeepSignals(roster, "");

    const totalSkrapers = roster.filter((a) => a.isSkraper).length;
    return { worldId, accountCount: roster.length, skraperCount: totalSkrapers, accounts: roster };
  } finally {
    Math.random = originalRandom;
  }
}

// ===========================================================================
// Round 28 (#3 engagement history, #4 metadata tells): the per-account DEEP
// record — an extension of the existing per-account signal system, read by
// simulation/investigate.js's computeDeepSignals and unlocked in play by a
// deep-investigate pull (ui/feed.js). `acct.deep`:
//   location      { city, utc } — the account's stated location (public;
//                 shown on its profile).
//   activityPeak  hour of peak session activity, in the STATED location's
//                 local time (the server-side session log).
//   photoMatches  how many unrelated profiles share its profile image.
//   recordCreated "Mon YYYY" server-record date, or null when it simply
//                 matches the displayed join date.
//   engagement    [{ kind, minsAgo, tone, query?|snippet?, acctId?, postId? }]
//   tells         the metadata tells planted on this account — generator
//                 bookkeeping for tests and hint targeting only; the readout
//                 never reads it (see investigate.js).
//
// Deterministic: each account's record is drawn from its own mulberry32
// stream seeded off `seedPrefix|acct.id`, never Math.random, so it's the
// same on every rebuild regardless of generation order. Idempotent: an
// account that already has a record keeps it — which is what lets
// game/cases.js run this over a whole case roster after the fact (to cover
// hand-authored builders and event announcers) without disturbing records
// generateWorld already attached.
//
// Fractions (per Skraper, independently, so a Skraper can carry 0-3):
//   timezone mismatch   35%   (sleepers: half — they're built to be careful)
//   stock-photo match   30%   (sleepers: half)
//   pre-launch record   20%   (sleepers: half)
// ~64% of ordinary Skrapers carry at least one; ~36% carry none, and a
// Controller (no posts, findable only through the follow graph by design)
// never carries any. Real people carry none (bar Round 29's deliberate red
// herrings — see applyRedHerrings below) — but night-shift/student hours
// genuinely peak at 2-4am and ~4% of people share a photo with a relative,
// so the readouts still misfire on real people the way every signal should.
// ===========================================================================
const DEEP_LOCATIONS = [
  { city: "London", utc: 0 }, { city: "Manchester", utc: 0 }, { city: "Dublin", utc: 0 }, { city: "Lisbon", utc: 0 },
  { city: "Berlin", utc: 1 }, { city: "Madrid", utc: 1 }, { city: "Warsaw", utc: 1 }, { city: "Lagos", utc: 1 },
  { city: "Athens", utc: 2 }, { city: "Nairobi", utc: 3 }, { city: "Mumbai", utc: 5.5 }, { city: "Singapore", utc: 8 },
  { city: "Tokyo", utc: 9 }, { city: "Sydney", utc: 10 }, { city: "São Paulo", utc: -3 }, { city: "Toronto", utc: -5 },
  { city: "New York", utc: -5 }, { city: "Chicago", utc: -6 }, { city: "Denver", utc: -7 }, { city: "Los Angeles", utc: -8 },
];
const DEEP_TELL_RATES = { timezone: 0.35, photo: 0.3, record: 0.2 };
const SLEEPER_TELL_FACTOR = 0.5;
const HUMAN_SHARED_PHOTO_RATE = 0.04;
const HUMAN_DOOMSCROLL_RATE = 0.06;
// People who follow the news, the council, the cost of living or true crime
// genuinely doomscroll more — the engagement readout's built-in false
// positives, same spirit as night-shift workers peaking at 3am.
const ANXIOUS_PERSONALITIES = ["news_follower", "concerned_citizen", "cost_of_living_watcher", "local_council_watcher", "true_crime_fan", "grumpy_traditionalist"];
const ANXIOUS_DOOMSCROLL_RATE = 0.3;
const ENGAGEMENT_ITEMS = 6;
// Off-network content an account engaged with — outrage/conspiracy bait
// (searches and reactions), and ordinary unrelated browsing.
const INFLAMMATORY_SEARCHES = [
  "the real story they're hiding", "proof the numbers are fake", "who is really behind the council",
  "deleted post reupload", "they don't want you to see this", "exposed thread full", "boycott list",
  "why is nobody reporting this",
];
const INFLAMMATORY_REACTIONS = [
  "a thread claiming last week's outage was deliberate", "a reupload of a deleted 'exposé' video",
  "a post calling the local council 'traitors'", "a pile-on reply thread against a journalist",
  "an 'anonymous insider' screenshot with no source", "a post insisting the tour story is a cover-up",
  "a 'share before it's taken down' clip", "a thread naming 'the accounts that are lying to you'",
];
const OFFTOPIC_SEARCHES = ["weather this weekend", "train times", "best cheap headphones", "trending", "top posts today", "funny dog videos", "recipe ideas"];

function deepRng(seedPrefix, acctId) {
  return mulberry32(hashSeed(`${seedPrefix}|deep|${acctId}`));
}

function peakFromActiveHours(activeHours, rng) {
  const [start, end] = activeHours || [9, 21];
  const span = end > start ? end - start : 24 - start + end;
  const mid = start + span / 2 + (rng() * 2 - 1);
  return Math.round(((mid % 24) + 24) % 24);
}

function snippetOf(text) {
  const t = String(text || "").replace(/\s@\S+$/, "");
  return t.length > 72 ? `${t.slice(0, 69)}…` : t;
}

function attachDeepSignals(roster, seedPrefix) {
  const P = typeof window !== "undefined" && window.SKRAPERS_PERSONALITIES;
  const INV = typeof window !== "undefined" && window.SKRAPERS_INVESTIGATE;
  const launchYear = INV && INV.ALGO_LAUNCH ? INV.ALGO_LAUNCH.year : 2010;
  const all = P ? { ...P.HUMAN_PERSONALITIES, ...P.SKRAPER_TYPES } : {};
  const byId = new Map(roster.map((a) => [a.id, a]));
  const postsOf = (a) => (a && a.posts) || [];
  const pick = (rng, arr) => arr[Math.floor(rng() * arr.length)];

  roster.forEach((acct) => {
    if (!acct || acct.deep || acct.id === "__player__") return;
    const rng = deepRng(seedPrefix || "", acct.id);
    const p = all[acct.personalityKey] || {};
    const isController = acct.isSkraper && !postsOf(acct).length;
    const isSleeper = acct.personalityKey === "sleeper";
    const deep = { location: pick(rng, DEEP_LOCATIONS), activityPeak: null, photoMatches: 0, recordCreated: null, engagement: [], tells: [] };

    // --- metadata ---
    const f = acct.isSkraper && isSleeper ? SLEEPER_TELL_FACTOR : 1;
    const rTz = rng(), rPhoto = rng(), rRec = rng(); // always drawn, so every account's stream has the same shape
    if (acct.isSkraper && !isController) {
      if (rTz < DEEP_TELL_RATES.timezone * f) {
        deep.tells.push("timezone");
        deep.activityPeak = 2 + Math.floor(rng() * 3); // 02:00-04:00 where it claims to live
      } else {
        deep.activityPeak = 11 + Math.floor(rng() * 8); // scheduled to look like an ordinary day
      }
      if (rPhoto < DEEP_TELL_RATES.photo * f) {
        deep.tells.push("photo");
        deep.photoMatches = 7 + Math.floor(rng() * 42);
      }
      if (rRec < DEEP_TELL_RATES.record * f) {
        deep.tells.push("record");
        deep.recordCreated = `${MONTHS[Math.floor(rng() * 12)]} ${launchYear - 5 + Math.floor(rng() * 5)}`;
      }
    } else if (!acct.isSkraper) {
      deep.activityPeak = peakFromActiveHours(p.activeHours, rng);
      if (rPhoto < HUMAN_SHARED_PHOTO_RATE) deep.photoMatches = 1 + Math.floor(rng() * 2);
    }
    // Round 29 (#2): a red herring's deep-level traits override the ordinary
    // human record here — AFTER every draw above, so the record's stream is
    // consumed exactly as for any other person, and from the herring's own
    // plan values, not this rng.
    const herring = !acct.isSkraper && acct.herringPlan ? acct.herringPlan : null;
    if (herring) {
      if (herring.kinds.indexOf("timezone") !== -1) deep.activityPeak = herring.peak;
      if (herring.kinds.indexOf("photo") !== -1) deep.photoMatches = herring.photoMatches;
    }

    // --- engagement history ---
    const ownTopics = (p.topicPool || p.topics || []).slice();
    const followingSet = new Set(acct.following || []);
    const networkPosts = [];
    roster.forEach((o) => {
      if (o.id === acct.id) return;
      const near = followingSet.has(o.id) || (!acct.isSkraper && !o.isSkraper && o.personalityKey === acct.personalityKey);
      if (near) postsOf(o).forEach((post) => networkPosts.push({ o, post }));
    });
    const skraperPosts = [];
    roster.forEach((o) => {
      if (o.id !== acct.id && o.isSkraper) postsOf(o).forEach((post) => skraperPosts.push({ o, post }));
    });
    const popular = roster.filter((o) => o.id !== acct.id && postsOf(o).length).sort((a, b) => (b.followers || 0) - (a.followers || 0)).slice(0, 4);
    const popularPosts = [];
    popular.forEach((o) => postsOf(o).slice(0, 2).forEach((post) => popularPosts.push({ o, post })));

    const react = (entry, tone, minsAgo) => ({
      kind: pick(rng, ["liked", "liked", "commented on", "replied to"]),
      minsAgo,
      tone,
      acctId: entry.o.id,
      postId: entry.post.id,
      snippet: snippetOf(entry.post.text),
    });
    const search = (query, tone, minsAgo) => ({ kind: "searched", minsAgo, tone, query });
    // Stage 31 (#3): "reposted" was an engagement kind long after the repost
    // feature itself was removed from the game — swapped for "commented on",
    // which the player can actually do. Same number of options in every
    // pick(), so the seeded stream (and every deterministic case) is unchanged.
    const external = (tone, minsAgo) => ({ kind: pick(rng, ["liked", "commented on"]), minsAgo, tone, snippet: pick(rng, INFLAMMATORY_REACTIONS) });
    const spreadMins = () => 5 + Math.floor(rng() * 4000);
    const items = [];

    if (!acct.isSkraper) {
      // A real person mostly engages with their own interests and their
      // own people; a small minority doomscroll outrage too.
      const doom = rng() < (ANXIOUS_PERSONALITIES.indexOf(acct.personalityKey) !== -1 ? ANXIOUS_DOOMSCROLL_RATE : HUMAN_DOOMSCROLL_RATE);
      const doomCount = 2 + Math.floor(rng() * 2);
      for (let i = 0; i < ENGAGEMENT_ITEMS; i++) {
        const r = rng();
        if (doom && i < doomCount) items.push(i % 2 === 0 ? search(pick(rng, INFLAMMATORY_SEARCHES), "inflammatory", spreadMins()) : external("inflammatory", spreadMins()));
        else if (r < 0.4 && ownTopics.length) items.push(search(pick(rng, ownTopics), "aligned", spreadMins()));
        else if (r < 0.85 && networkPosts.length) items.push(react(pick(rng, networkPosts), "aligned", spreadMins()));
        else if (ownTopics.length && r < 0.9) items.push(search(pick(rng, ownTopics), "aligned", spreadMins()));
        else items.push(search(pick(rng, OFFTOPIC_SEARCHES), "offtopic", spreadMins()));
      }
    } else {
      const key = acct.personalityKey;
      const r = rng();
      let style;
      if (isController) style = "cluster";
      else if (isSleeper) style = r < 0.55 ? "mismatch" : "hollow";
      else if (key === "influencer" || key === "adbot" || key === "recruiter") style = r < 0.4 ? "cluster" : r < 0.55 ? "mismatch" : "hollow";
      else style = r < 0.35 ? "mismatch" : r < 0.65 ? "cluster" : "hollow";
      deep.engagementStyle = style;
      if (style === "cluster" && skraperPosts.length >= 2) {
        // Reactions to the rest of the network's posts, fired in a burst.
        const burstAt = 3 + Math.floor(rng() * 600);
        const burstSize = Math.min(skraperPosts.length, 3 + Math.floor(rng() * 3));
        const pool = skraperPosts.slice();
        for (let i = 0; i < burstSize; i++) items.push(react(pool.splice(Math.floor(rng() * pool.length), 1)[0], "cluster", burstAt));
        while (items.length < ENGAGEMENT_ITEMS) items.push(search(pick(rng, OFFTOPIC_SEARCHES), "offtopic", spreadMins()));
      } else if (style === "mismatch" || (style === "cluster" && skraperPosts.length < 2)) {
        // Posts one thing in public, engages with something else entirely.
        const alignedCount = 1 + Math.floor(rng() * 2);
        for (let i = 0; i < ENGAGEMENT_ITEMS; i++) {
          if (i < alignedCount && ownTopics.length) items.push(search(pick(rng, ownTopics), "aligned", spreadMins()));
          else if (rng() < 0.5) items.push(search(pick(rng, INFLAMMATORY_SEARCHES), "inflammatory", spreadMins()));
          else items.push(external("inflammatory", spreadMins()));
        }
      } else {
        // Hollow: engages with whatever's popular, not with anything it
        // actually cares about — moderate, not damning.
        for (let i = 0; i < ENGAGEMENT_ITEMS; i++) {
          const rr = rng();
          if (rr < 0.5 && ownTopics.length) items.push(search(pick(rng, ownTopics), "aligned", spreadMins()));
          else if (rr < 0.8 && popularPosts.length) items.push(react(pick(rng, popularPosts), "offtopic", spreadMins()));
          else items.push(search(pick(rng, OFFTOPIC_SEARCHES), "offtopic", spreadMins()));
        }
      }
    }
    // Round 29 (#2): an engagement red herring — a real person whose history
    // really does mostly NOT match what they post (hate-reading, research, a
    // guilty-pleasure niche). Rebuilt from the herring's own stream so the
    // readout crosses into HIGH exactly the way a Skraper's mismatch does.
    if (herring && herring.kinds.indexOf("engagement") !== -1) {
      const hr = mulberry32(hashSeed(`${seedPrefix || ""}|herring-eng|${acct.id}`));
      const hp = (arr) => arr[Math.floor(hr() * arr.length)];
      const rebuilt = [];
      for (let i = 0; i < ENGAGEMENT_ITEMS; i++) {
        const when = 5 + Math.floor(hr() * 4000);
        if (i === 0 && ownTopics.length) rebuilt.push({ kind: "searched", minsAgo: when, tone: "aligned", query: hp(ownTopics) });
        else if (herring.reason.engagement === "guilty" && i % 2 === 1) rebuilt.push({ kind: "searched", minsAgo: when, tone: "offtopic", query: hp(HERRING_GUILTY_SEARCHES) });
        else if (i % 2 === 0) rebuilt.push({ kind: "searched", minsAgo: when, tone: "inflammatory", query: hp(INFLAMMATORY_SEARCHES) });
        else rebuilt.push({ kind: hp(["liked", "commented on"]), minsAgo: when, tone: "inflammatory", snippet: hp(INFLAMMATORY_REACTIONS) });
      }
      items.length = 0;
      items.push(...rebuilt);
    }
    items.sort((a, b) => a.minsAgo - b.minsAgo);
    deep.engagement = items;
    if (herring) {
      // A travelling herring is somewhere whose daytime really is the stated
      // city's small hours — chosen here, now the stated location exists.
      let travel = null;
      if (herring.reason.timezone === "travelling") {
        const far = DEEP_LOCATIONS.filter((l) => Math.abs(l.utc - deep.location.utc) >= 7);
        const tr = mulberry32(hashSeed(`${seedPrefix || ""}|herring-travel|${acct.id}`));
        travel = far.length ? far[Math.floor(tr() * far.length)] : null;
      }
      deep.herring = { kinds: herring.kinds.slice(), reason: { ...herring.reason }, travel, interval: herring.interval || null };
      delete acct.herringPlan;
    }
    acct.deep = deep;
  });
  return roster;
}

// ===========================================================================
// Round 29 (#2): RED HERRINGS — innocent people who look suspicious.
// Before this round every suspicion signal leaned one way: a timezone
// mismatch, a stock-photo match, a hollow engagement history or a
// clockwork posting rhythm was (almost) only ever a Skraper. The existing
// false positives were soft (night-shift peaks read MEDIUM-to-HIGH, ~4% of
// people share a photo with a relative, some doomscroll). This adds a
// genuine minority of real people who carry one — sometimes two — of the
// SAME tells a Skraper carries, at the SAME strength, for a mundane reason:
//   timezone    sessions peak at 2-4am where they say they live — they're
//               travelling for work, work remotely on another continent's
//               hours, or just don't sleep.
//   photo       profile image on 7-26 unrelated profiles — it's a stock
//               landscape (they keep their face offline) or a portrait from
//               their own photography portfolio that gets lifted constantly.
//   engagement  history mostly outrage/off-topic — hate-reading, research
//               for something they're writing, or a guilty-pleasure niche.
//   cadence     posts on a near-perfect interval — a scheduling app.
//   tone        flat, uniform, slightly stilted sentences — writing in a
//               second language, or just terse.
// Every herring carries a REASON, and that reason is what they say when
// interrogated (game/comments.js) — their answers stay consistent and
// explain the trait, which is how a careful player clears them. The deep
// readout (simulation/investigate.js) never reads any of this: a herring's
// signal simply reads HIGH, exactly like a Skraper's.
//
// Fraction (judgment call, tuned against game/state.js's wrongful-flag
// limit of 3/4/5/6 by roster size): each real person independently rolls
// HERRING_RATE (7%), capped at 10% of the people in the world, and any
// world with 10+ people is guaranteed at least one. A 30-account case
// therefore holds ~2 herrings beside ~2 Skrapers — enough that "flag
// everything that reads HIGH" burns two of the three strikes on its own,
// not so many that the strike budget is unwinnable for a careful player
// (herrings clear themselves under interrogation, and a deep pull shows
// that a herring's OTHER records are clean). Case 001/004/005/006 are
// hand-authored rosters with their own designed red herrings and don't go
// through generateWorld, so they're untouched.
// Deterministic per account id (own mulberry32 stream), never Math.random.
// ===========================================================================
const HERRING_RATE = 0.07;
const HERRING_MAX_SHARE = 0.1;
const HERRING_GUARANTEE_MIN_HUMANS = 10;
const HERRING_SECOND_TRAIT_CHANCE = 0.3;
const HERRING_KIND_WEIGHTS = [
  ["timezone", 0.3],
  ["engagement", 0.25],
  ["cadence", 0.2],
  ["photo", 0.15],
  ["tone", 0.1],
];
const HERRING_REASONS = {
  timezone: ["travelling", "remote", "insomnia"],
  photo: ["stock", "portfolio"],
  engagement: ["hateread", "research", "guilty"],
  cadence: ["scheduler"],
  tone: ["esl", "terse"],
};
const HERRING_GUILTY_SEARCHES = ["reality show recap", "celebrity feud timeline", "that dating show finale", "wrestling results", "horoscope this week"];
// Flat, uniform, slightly stilted — every line within a few characters of
// the others, so the linguistic-consistency readout flattens the way a
// templated account's does.
const HERRING_FLAT_POSTS = [
  "Today was a normal day. Work was fine.",
  "The weather is good today. I am happy.",
  "I went to the shop today. It was busy.",
  "Weekend is soon. I will rest at home.",
  "I made dinner tonight. It was simple.",
  "Long day at work today. Now I relax.",
  "I read the news today. It is a lot.",
  "My train was late today. Not so good.",
];

function herringRng(seedPrefix, acctId) {
  return mulberry32(hashSeed(`${seedPrefix}|herring|${acctId}`));
}

function pickWeightedKind(r, exclude) {
  const pool = HERRING_KIND_WEIGHTS.filter(([k]) => k !== exclude);
  const total = pool.reduce((n, [, w]) => n + w, 0);
  let acc = 0;
  for (const [k, w] of pool) {
    acc += w / total;
    if (r < acc) return k;
  }
  return pool[pool.length - 1][0];
}

function applyRedHerrings(roster, seedPrefix) {
  const prefix = seedPrefix || "";
  const humans = roster.filter((a) => a && !a.isSkraper && a.id !== "__player__" && !a.herringChecked && (a.posts || []).length);
  if (!humans.length) return roster;
  // One roll per person, drawn first from each person's own stream, so the
  // cap and the guarantee below can rank people without extra draws.
  const rolls = humans.map((a) => {
    const rng = herringRng(prefix, a.id);
    return { acct: a, rng, roll: rng() };
  });
  let chosen = rolls.filter((r) => r.roll < HERRING_RATE);
  const cap = Math.max(1, Math.floor(humans.length * HERRING_MAX_SHARE));
  if (chosen.length > cap) chosen = chosen.sort((a, b) => a.roll - b.roll).slice(0, cap);
  if (!chosen.length && humans.length >= HERRING_GUARANTEE_MIN_HUMANS) chosen = [rolls.slice().sort((a, b) => a.roll - b.roll)[0]];
  const byId = new Map(roster.map((a) => [a.id, a]));

  humans.forEach((a) => (a.herringChecked = true));
  chosen.forEach(({ acct, rng }) => {
    const pick = (arr) => arr[Math.floor(rng() * arr.length)];
    const first = pickWeightedKind(rng());
    const kinds = [first];
    if (rng() < HERRING_SECOND_TRAIT_CHANCE) kinds.push(pickWeightedKind(rng(), first));
    const plan = { kinds, reason: {} };
    kinds.forEach((k) => (plan.reason[k] = pick(HERRING_REASONS[k])));
    if (acct.personalityKey === "night_shift_worker" && plan.reason.timezone) plan.reason.timezone = "nightshift";

    if (kinds.indexOf("timezone") !== -1) {
      plan.peak = 2 + Math.floor(rng() * 3);
      // A "travelling" herring's destination is chosen in attachDeepSignals,
      // once the stated location it has to be far from actually exists.
    }
    if (kinds.indexOf("photo") !== -1) plan.photoMatches = 7 + Math.floor(rng() * 20);

    // Post-level traits are applied right here, before any deep record
    // quotes these posts.
    if (kinds.indexOf("cadence") !== -1) {
      const interval = pick([60, 90, 120]);
      const start = 20 + Math.floor(rng() * 240);
      const sorted = acct.posts.slice().sort((x, y) => y.timestamp - x.timestamp);
      const now = Date.now();
      sorted.forEach((post, i) => {
        post.timestamp = now - (start + i * interval + Math.round((rng() * 2 - 1) * 2)) * 60000;
      });
      acct.posts = sorted;
      plan.interval = interval;
    }
    if (kinds.indexOf("tone") !== -1) {
      acct.posts.forEach((post) => {
        if (post.postType) return; // a promo post stays the account's own
        let text = pick(HERRING_FLAT_POSTS);
        const target = post.mentionsAcctId ? byId.get(post.mentionsAcctId) : null;
        if (target) text = `${text} ${target.handle}`;
        post.text = text;
      });
    }
    acct.herringPlan = plan;
  });
  return roster;
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = { generateWorld, mulberry32, hashSeed, randomWorldId, attachDeepSignals, applyRedHerrings, DEEP_LOCATIONS };
} else {
  window.SKRAPERS_WORLDGEN = { generateWorld, randomWorldId, attachDeepSignals, applyRedHerrings, DEEP_LOCATIONS };
}

})();

</script>

<script>

// roadmap's Stage 4 scope (deliberately not the full reputation system from
// the design doc's section 31 yet — that's later):
//   1. M.A.I. credibility — moves when the player flags someone, correctly
//      or not. This is the "does falsely accusing someone feel meaningful"
//      test (MVP Question 5).
//   2. False-negative growth — a Skraper that's never correctly flagged
//      keeps gaining followers and posting, visibly, on later visits.
//      "The world remembers what the player fails to investigate."
//
// Deliberately in-memory only (resets on reload) — this stage is testing
// whether the mechanic feels meaningful in a session, not building save
// persistence, which isn't listed as needed until much later.

(function () {

const state = {
  credibility: 100,

  dms: {},

  failedCaseAttempts: {},

  deepInvestigated: {},

  algoPreflag: null,

  caseActions: { investigated: {}, connections: {} },

  caseRecords: {},
  secondOpinionHistory: [],
  // Round 23 (#3): device-level display preferences, not game progress —

  // Round 30 (#6): `simplifiedMode` joins them — a play-style preference,

  settings: { darkMode: false, highContrast: false, simplifiedMode: false },
  // Round 30 (#1): the Case 001 guided walkthrough. `seen` maps a tip id to

  //   moments  { sponsored, freeFee } — the Marketplace's one-off call-outs,
  //            each false until that moment has happened once (then the time

  // Same lifetime as `seen`/`skipped`: kept across a Log out.
  tutorial: { seen: {}, skipped: false, tours: { main: false, case001: false, market: false }, moments: { sponsored: false, freeFee: false } },

  // `lastVisitAt` (when the player last arrived on the grid — listings only
  // sell and get replaced on a RETURN visit, never mid-look);
  // marketplace.messages holds each sent message with the `respondAt` time
  // its reply is due. Player progress, so a genuine "New investigation"
  // (resetState) clears it; a normal world switch doesn't, since each world
  // keeps its own market under its own key.
  marketplace: { worlds: {}, messages: [] },
};

// Round 30 (#1): tip bookkeeping. A retired tip never comes back.
function isTutorialTipSeen(id) {
  return !!(state.tutorial && (state.tutorial.skipped || state.tutorial.seen[id]));
}

function retireTutorialTip(id, how) {
  state.tutorial = state.tutorial || { seen: {}, skipped: false };
  if (state.tutorial.seen[id]) return false;
  state.tutorial.seen[id] = how || "dismissed";
  return true;
}

// Stage 32 (#8): the Marketplace's first-visit guide shares the walkthrough's
// record (tutorial.seen, retired with retireTutorialTip) but NOT its "skip"
// switch — skipping the Case 001 walkthrough says nothing about whether a
// player has seen a feature that didn't exist yet.
function isGuideTipSeen(id) {
  return !!(state.tutorial && state.tutorial.seen && state.tutorial.seen[id]);
}

function skipTutorial() {
  state.tutorial = state.tutorial || { seen: {}, skipped: false };
  state.tutorial.skipped = true;
}

// Stage 33: the spotlight tours' and Marketplace moments' flags (see the
// `tutorial` comment above). Every accessor tolerates a record from an older
// save that has neither sub-object yet.
const TOUR_IDS = ["main", "case001", "market"];
const MOMENT_IDS = ["sponsored", "freeFee"];

function ensureTutorialRecord() {
  const t = state.tutorial && typeof state.tutorial === "object" ? state.tutorial : (state.tutorial = { seen: {}, skipped: false });
  if (!t.seen || typeof t.seen !== "object") t.seen = {};
  t.skipped = !!t.skipped;
  if (!t.tours || typeof t.tours !== "object") t.tours = {};
  if (!t.moments || typeof t.moments !== "object") t.moments = {};
  TOUR_IDS.forEach((id) => (t.tours[id] = !!t.tours[id]));
  MOMENT_IDS.forEach((id) => (t.moments[id] = t.moments[id] || false));
  return t;
}

function isTourSeen(id) {
  return !!(state.tutorial && state.tutorial.tours && state.tutorial.tours[id]);
}

function markTourSeen(id) {
  const t = ensureTutorialRecord();
  if (t.tours[id]) return false;
  t.tours[id] = true;
  return true;
}

function isMomentSeen(id) {
  return !!(state.tutorial && state.tutorial.moments && state.tutorial.moments[id]);
}

function markMomentSeen(id) {
  const t = ensureTutorialRecord();
  if (t.moments[id]) return false;
  t.moments[id] = Date.now();
  return true;
}

// Rebuilds a saved `tutorial` record into the current shape. A save from
// before Stage 33 has no `tours`: its player is already past onboarding, so
// the opening tour counts as seen (they can replay it from Settings); the
// Marketplace tour counts as seen only if they had finished (or skipped) the
// old five-tip guide it replaces (`marketGuideIds`); the Case 001 walkthrough
// keeps its per-beat record untouched and its summary flag is re-derived by
// the caller, which knows the beats.
function normalizeTutorial(saved, marketGuideIds) {
  const src = saved && typeof saved === "object" ? saved : {};
  const legacy = !src.tours || typeof src.tours !== "object";
  const seen = src.seen && typeof src.seen === "object" ? { ...src.seen } : {};
  const tours = legacy ? {} : { ...src.tours };
  const moments = src.moments && typeof src.moments === "object" ? { ...src.moments } : {};
  if (legacy) {
    tours.main = true; // only ever called while restoring a save, i.e. for a player who has already been through onboarding
    tours.market = (marketGuideIds || []).length > 0 && marketGuideIds.every((id) => !!seen[id]);
  }
  state.tutorial = { seen, skipped: !!src.skipped, tours, moments };
  return ensureTutorialRecord();
}

// Round 30 (#3): per-world case-attempt actions the nudge reads.
function recordCaseAction(kind, acctId) {
  state.caseActions = state.caseActions || { investigated: {}, connections: {} };
  const bucket = state.caseActions[kind] || (state.caseActions[kind] = {});
  if (bucket[acctId]) return false;
  bucket[acctId] = true;
  return true;
}

function caseActionCount(kind) {
  return Object.keys((state.caseActions && state.caseActions[kind]) || {}).length;
}

function dismissCaseNudge(key) {
  state.caseNudgeDismissed = state.caseNudgeDismissed || [];
  if (state.caseNudgeDismissed.indexOf(key) === -1) state.caseNudgeDismissed.push(key);
}

function toggleSetting(name) {
  state.settings[name] = !state.settings[name];
  return state.settings[name];
}

function clamp(n, lo, hi) {
  return Math.max(lo, Math.min(hi, n));
}

// Stage 31 (#12): the standing swing of one formal flag. A wrongful flag
// used to cost -10 — five of those and a player's standing was half gone
// from ordinary learning mistakes. Rescaled so one honest mistake costs -2.
// The case-failure limit (wrongFlagLimitFor/wrongfulFlagCount below) counts
// RAW wrongful flags, never these points, so it is untouched by this: a case
// is still pulled after exactly as many mistakes as before.
const CORRECT_FLAG_STANDING = 4;
const WRONG_FLAG_STANDING = -2;

// Returns { correct, delta, message } and mutates state.
function flagAccount(acct) {
  if (state.flagged[acct.id]) {
    return { alreadyFlagged: true, correct: state.flagged[acct.id].correct };
  }
  const correct = !!acct.isSkraper;
  const delta = correct ? CORRECT_FLAG_STANDING : WRONG_FLAG_STANDING;
  state.credibility = clamp(state.credibility + delta, 0, 100);
  state.flagged[acct.id] = { correct, at: Date.now() };
  // Round 27: guarded against duplicates — a failed case's retry (see
  // failedCaseAttempts above) rebuilds the SAME deterministic accounts, so
  // correctly catching the same Skraper again on the retry shouldn't list
  // it twice in "Successful Bots Removed".
  if (correct && !state.removedBots.some((r) => r.acctId === acct.id)) {
    state.removedBots.unshift({ acctId: acct.id, name: acct.name, handle: acct.handle, at: Date.now() });
  }

  const message = correct
    ? `Correctly flagged. Account suspended pending review. M.A.I. credibility +${delta}.`
    : `This account has appealed the flag — no violation found. M.A.I. credibility ${delta}.`;

  return { correct, delta, message, credibility: state.credibility };
}

// Stage 17 (#flag rework): the lightweight red/green flag pair. Free,
// togglable, zero credibility/reputation consequence — personal markers
// the player uses to build their OWN shortlist, not an accusation. Red is
// a list of timestamps rather than a boolean (see state.postFlags above);
// toggling it off clears the list, toggling it back on starts a fresh one
// so a post's "flagged again" count is always just its current list.
function toggleRedFlag(post, acct) {
  const entry = state.postFlags[post.id] || (state.postFlags[post.id] = { red: [], green: false, acctId: acct.id });
  const wasActive = entry.red.length > 0;
  if (wasActive) {
    entry.red = [];
  } else {
    entry.red.push(Date.now());
  }
  return { active: !wasActive, count: entry.red.length };
}

// A fresh flag event on a post that's already been red-flagged before —
// used when a flagged post organically grows a new comment/signal change
// (see game/comments.js) and the player chooses to mark it again, rather
// than the toggle above which is a straight on/off.
function addRedFlagPing(postId, acctId) {
  const entry = state.postFlags[postId] || (state.postFlags[postId] = { red: [], green: false, acctId });
  entry.red.push(Date.now());
  return entry.red.length;
}

function toggleGreenFlag(post, acct) {
  const entry = state.postFlags[post.id] || (state.postFlags[post.id] = { red: [], green: false, acctId: acct.id });
  entry.green = !entry.green;
  return { active: entry.green };
}

function isRedFlagged(postId) {
  const e = state.postFlags[postId];
  return !!(e && e.red.length > 0);
}

// `acctId` is optional — when passed, a post also reads as green-flagged
// if the whole ACCOUNT has been marked trusted from its profile (see
// toggleAccountTrust below), so the account-level toggle and the existing
// per-post toggle share one underlying "trusted" reading rather than
// forking into two systems the UI has to reconcile.
function isGreenFlagged(postId, acctId) {
  const e = state.postFlags[postId];
  if (e && e.green) return true;
  return !!(acctId && state.trustedAccounts[acctId]);
}

// Feature round: Follow — free, reversible, purely social.
function toggleFollow(acctId) {
  const active = !state.following[acctId];
  if (active) state.following[acctId] = true;
  else delete state.following[acctId];
  return { active };
}

function isFollowing(acctId) {
  return !!state.following[acctId];
}

// Feature round: Mark as Trusted — the account-level shortcut isGreenFlagged
// above reads. Free, reversible, zero credibility/reputation consequence,
// same spirit as the post-level green flag.
function toggleAccountTrust(acctId) {
  const active = !state.trustedAccounts[acctId];
  if (active) state.trustedAccounts[acctId] = true;
  else delete state.trustedAccounts[acctId];
  return { active };
}

function isAccountTrusted(acctId) {
  return !!state.trustedAccounts[acctId];
}

// Feature round: the one-exchange DM system. `text` is the player's
// premade message; `reply` is the account's premade response, already
// generated by the caller (game/comments.js's generateDMReply) — state.js
// just stores the exchange, it doesn't generate content itself.
function canMessage(acctId) {
  return !state.dms[acctId];
}

function dmFor(acctId) {
  return state.dms[acctId] || null;
}

function sendMessage(acctId, text, reply) {
  const entry = {
    sentText: text,
    sentAt: Date.now(),
    replyText: reply.text,
    replyAt: Date.now(),
    readsBotlike: !!reply.readsBotlike,
  };
  state.dms[acctId] = entry;
  return entry;
}

// ===========================================================================
// Round 29 (#1): INTERROGATION records. Content is generated by the caller
// (game/comments.js's interrogationAnswer); this only stores it. Per-world
// (see WORLD_EXTRA_KEYS), capped at `limit` questions per account.
// ===========================================================================
function interrogationFor(acctId) {
  return (state.interrogations && state.interrogations[acctId]) || null;
}

function recordInterrogation(acctId, qid, question, answer, limit) {
  state.interrogations = state.interrogations || {};
  const entry = state.interrogations[acctId] || (state.interrogations[acctId] = { asked: [], marks: {} });
  if (entry.asked.length >= (limit || 3)) return null;
  if (entry.asked.some((x) => x.qid === qid)) return null;
  entry.asked.push({ qid, q: question, a: answer.text, clock: answer.clock || null, silent: !!answer.silent, at: Date.now() });
  return entry;
}

// The player's own verdict on a cross-checked pair. Setting the same
// verdict again clears it (a toggle), so a hasty mark can be taken back.
function markCrossCheck(acctId, fact, verdict) {
  const entry = interrogationFor(acctId);
  if (!entry) return null;
  if (entry.marks[fact] === verdict) delete entry.marks[fact];
  else entry.marks[fact] = verdict;
  return entry.marks[fact] || null;
}

// ===========================================================================
// Round 29 (#3): CLOSING REPORTS. A report is written by ui/feed.js's
// closing step for every formal flag made inside a case; `grade` is one of
//   "clean"    — correct, and the deciding evidence the player named is a
//                real tell on that account
//   "lucky"    — correct, but the named evidence wasn't what actually gives
//                that account away (a gut call, hearsay, a coincidence)
//   "wrongful" — the account was a real person (the existing wrongful-flag
//                consequences apply exactly as before)
// ===========================================================================
function recordClosingReport(report) {
  state.closingReports = state.closingReports || [];
  const entry = { ...report, at: Date.now() };
  state.closingReports.push(entry);
  return entry;
}

function closingReportFor(acctId) {
  return (state.closingReports || []).find((r) => r.acctId === acctId) || null;
}

// One grade for a whole case from its flags' reports. A case is "well
// evidenced" only if every correct flag in it was argued from real
// evidence; any lucky call drags it to "mixed", and a case won mostly on
// luck says so.
function summarizeReports(reports) {
  const list = reports || [];
  const clean = list.filter((r) => r.grade === "clean").length;
  const lucky = list.filter((r) => r.grade === "lucky").length;
  const wrongful = list.filter((r) => r.grade === "wrongful").length;
  let grade = "Unreported";
  if (clean + lucky > 0) grade = lucky === 0 ? "Well-evidenced" : clean >= lucky ? "Mixed" : "Mostly luck";
  return { clean, lucky, wrongful, grade };
}

function recordCaseRecord(caseId, record) {
  state.caseRecords = state.caseRecords || {};
  state.caseRecords[caseId] = { ...record, at: Date.now() };
  return state.caseRecords[caseId];
}

function recordSecondOpinion(entry) {
  state.secondOpinionHistory = state.secondOpinionHistory || [];
  state.secondOpinionHistory.unshift({ ...entry, at: Date.now() });
  state.secondOpinionHistory = state.secondOpinionHistory.slice(0, 40);
}

// ===========================================================================
// Round 29: the per-world extras, in one place (see the state comment).
// ===========================================================================
const WORLD_EXTRA_KEYS = ["interrogations", "closingReports", "rivalCall", "algoPreflag", "timelineViewed", "opinionsPlanned", "caseActions", "caseNudgeDismissed"];

function worldExtraDefaults() {
  return { interrogations: {}, closingReports: [], rivalCall: null, algoPreflag: null, timelineViewed: false, opinionsPlanned: false, caseActions: { investigated: {}, connections: {} }, caseNudgeDismissed: [] };
}

// A deep copy of the live world's extras — for a snapshot or a save.
function dumpWorldExtras() {
  const out = {};
  WORLD_EXTRA_KEYS.forEach((k) => (out[k] = state[k]));
  return JSON.parse(JSON.stringify(out));
}

// Makes `saved` (a dumpWorldExtras() result, or nothing) the live world's
// extras, failing open to defaults for anything missing or malformed.
function loadWorldExtras(saved) {
  const d = worldExtraDefaults();
  const src = saved && typeof saved === "object" ? JSON.parse(JSON.stringify(saved)) : {};
  state.interrogations = src.interrogations && typeof src.interrogations === "object" ? src.interrogations : d.interrogations;
  state.closingReports = Array.isArray(src.closingReports) ? src.closingReports : d.closingReports;
  state.rivalCall = src.rivalCall && typeof src.rivalCall === "object" ? src.rivalCall : null;
  state.algoPreflag = src.algoPreflag && typeof src.algoPreflag === "object" ? src.algoPreflag : null;
  state.timelineViewed = !!src.timelineViewed;
  state.opinionsPlanned = !!src.opinionsPlanned;
  const ca = src.caseActions && typeof src.caseActions === "object" ? src.caseActions : {};
  state.caseActions = {
    investigated: ca.investigated && typeof ca.investigated === "object" ? ca.investigated : {},
    connections: ca.connections && typeof ca.connections === "object" ? ca.connections : {},
  };
  state.caseNudgeDismissed = Array.isArray(src.caseNudgeDismissed) ? src.caseNudgeDismissed.filter((k) => typeof k === "string") : d.caseNudgeDismissed;
}

function redFlagCount(postId) {
  const e = state.postFlags[postId];
  return e ? e.red.length : 0;
}

// For the player's own profile — every currently red/green-flagged post,
// most-recently-flagged first.
function flaggedPostIds(kind) {
  return Object.entries(state.postFlags)
    .filter(([, e]) => (kind === "green" ? e.green : e.red.length > 0))
    .sort((a, b) => {
      const aAt = kind === "green" ? 0 : Math.max(...a[1].red);
      const bAt = kind === "green" ? 0 : Math.max(...b[1].red);
      return bAt - aAt;
    })
    .map(([postId]) => postId);
}

function isSuspended(acctId) {
  return !!(state.flagged[acctId] && state.flagged[acctId].correct);
}

function isFalselyFlagged(acctId) {
  return !!(state.flagged[acctId] && !state.flagged[acctId].correct);
}

// Item 12/13: Case Load completion tracking — a standing list, not scoped
// to a single world (see the completedCases comment above).
function isCaseCompleted(caseId) {
  return state.completedCases.indexOf(caseId) !== -1;
}

function markCaseCompleted(caseId) {
  if (isCaseCompleted(caseId)) return false;
  state.completedCases.push(caseId);
  return true;
}

// Round 27 (#2): how many wrongful FORMAL flags one case attempt tolerates
// before it's pulled pending review. Three is the baseline — enough room
// for one honest mistake and one careless one, not enough to guess your
// way through a ten-account case. Bigger networks get a little more
// slack, since a 50-account Case 007-style roster (or a 100+ account
// generated case) has proportionally more real people who can look
// suspicious on one signal: 4 from 31 accounts, 5 from 61, 6 from 101.
//
// Round 30 (#4): the FIRST case gets grace. Case 001 is where a brand-new
// player learns what a tell even looks like, so it tolerates
// FIRST_CASE_EXTRA_STRIKES more wrongful flags than its roster size would
// otherwise allow (3 -> 5 for its ten accounts) — and ui/feed.js's
// commitFormalFlag pairs every wrongful flag there with a plain-spoken line
// about why that account reads as a person. Keyed on the case id, so every
// other case's limit is byte-for-byte what it was: callers that don't pass
// a case id (or pass any other one) get the unchanged roster-size scale.
// Chosen over a one-time "that one didn't count" reprieve because the
// existing strike count is DERIVED from `flagged` (see wrongfulFlagCount) —
// a reprieve would mean a second, stored exception to keep in step with it
// through snapshots, hot-swaps and saves; a higher limit needs none of that.
const FIRST_CASE_ID = "case001";
const FIRST_CASE_EXTRA_STRIKES = 2;
function wrongFlagLimitFor(accountCount, caseId) {
  const n = accountCount || 0;
  let base = 3;
  if (n > 100) base = 6;
  else if (n > 60) base = 5;
  else if (n > 30) base = 4;
  return caseId === FIRST_CASE_ID ? base + FIRST_CASE_EXTRA_STRIKES : base;
}

// Wrongful formal flags in whichever world is currently loaded — derived
// from `flagged` rather than stored separately (see failedCaseAttempts).
function wrongfulFlagCount() {
  return Object.values(state.flagged || {}).filter((f) => f && !f.correct).length;
}

// Round 28 (#2): how many deep-investigate pulls one world (a case attempt,
// or the Home network) grants. Deliberately small and scaled on the same
// roster-size axis as wrongFlagLimitFor above, so the two budgets grow
// together: 3 for a ten-to-thirty-account case (enough to confirm your
// top suspects, not enough to check everyone), 4 from 31 accounts, 5 from
// 61 — capped there, because past that the point is still choosing.
// Home uses the same function against its (scroll-grown) roster.
function deepPullLimitFor(accountCount) {
  const n = accountCount || 0;
  if (n > 60) return 5;
  if (n > 30) return 4;
  return 3;
}

// Pulls spent in whichever world is loaded: one per deep-investigated
// account plus one per hint bought (hints are paid in the same currency).
function deepPullsUsed() {
  return Object.keys(state.deepInvestigated || {}).length + (state.caseHints || []).length;
}

function isDeepInvestigated(acctId) {
  return !!(state.deepInvestigated && state.deepInvestigated[acctId]);
}

// Spends one pull on `acctId` if the budget allows. Re-opening an account
// that's already been deep-investigated is free (the records stay
// unlocked for the rest of the attempt) and reports alreadyUnlocked.
function spendDeepPull(acctId, limit) {
  if (isDeepInvestigated(acctId)) return { ok: true, alreadyUnlocked: true, remaining: Math.max(0, limit - deepPullsUsed()) };
  if (deepPullsUsed() >= limit) return { ok: false, remaining: 0 };
  state.deepInvestigated[acctId] = { at: Date.now() };
  return { ok: true, remaining: Math.max(0, limit - deepPullsUsed()) };
}

// Spends one pull on a hint. `text` is already chosen by the caller
// (game/cases.js's caseHint) — state.js only records the purchase.
function spendHintPull(text, limit) {
  if (deepPullsUsed() >= limit) return { ok: false, remaining: 0 };
  state.caseHints.push({ text, at: Date.now() });
  return { ok: true, remaining: Math.max(0, limit - deepPullsUsed()) };
}

function recordCaseFailure(caseId, strikes, limit) {
  const prev = state.failedCaseAttempts[caseId] || { count: 0 };
  state.failedCaseAttempts[caseId] = { count: prev.count + 1, lastAt: Date.now(), lastStrikes: strikes, lastLimit: limit };
  return state.failedCaseAttempts[caseId];
}

function caseFailureCount(caseId) {
  const e = state.failedCaseAttempts[caseId];
  return e ? e.count : 0;
}

// Called on each return to the feed. Any Skraper NOT yet correctly
// flagged grows: more followers, and — a fraction of the time — one more
// post appears, generated the same way every other post is (no special
// casing), so it shows up in the feed exactly like organic content would.
function tickWorld(accounts) {
  state.visits += 1;
  const changes = [];
  accounts.forEach((acct) => {
    if (!acct.isSkraper) return;
    if (isSuspended(acct.id)) return;
    const followerGrowth = 20 + Math.floor(Math.random() * 180);
    acct.followers += followerGrowth;
    changes.push({ acctId: acct.id, followerGrowth });

    if (Math.random() < 0.4 && window.SKRAPERS_PERSONALITIES && window.SKRAPERS_GENERATE) {
      const { HUMAN_PERSONALITIES, SKRAPER_TYPES } = window.SKRAPERS_PERSONALITIES;
      const all = { ...HUMAN_PERSONALITIES, ...SKRAPER_TYPES };
      const p = all[acct.personalityKey];
      const newPost = {
        id: `${acct.id}-p${acct.posts.length}-grown`,
        text: window.SKRAPERS_GENERATE.generatePost(acct.personalityKey, p),
        timestamp: Date.now(),
      };
      acct.posts.unshift(newPost);
      changes.push({ acctId: acct.id, newPost: true });
    }
  });
  return changes;
}

// Stage 6: loading a new world (curated case or procedural) resets the
// investigation — credibility and flags belong to a specific case, not
// across worlds.
function resetState() {
  state.credibility = 100;
  state.flagged = {};
  state.visits = 0;
  state.postFlags = {};
  state.removedBots = [];
  state.following = {};
  state.trustedAccounts = {};
  state.dms = {};
  state.termsRushed = false;
  state.completedCases = [];
  state.failedCaseAttempts = {};
  state.securityGotcha = null;
  state.deepInvestigated = {};
  state.caseHints = [];
  state.caseRecords = {};
  state.secondOpinionHistory = [];
  state.marketplace = { worlds: {}, messages: [] };
  loadWorldExtras(null);
}

// Stage 15 (navigation/gameplay IA redesign): credibility is now a
// persistent player stat that survives navigating between Home/Daily/
// Story (see ui/feed.js's loadWorld) — only the flagged/visits state,
// which genuinely belongs to whichever world is currently loaded, resets
// on a normal world switch. Full resetState() above is still used for a
// deliberate "New investigation" (ui/feed.js's resetSession).
function resetWorldState() {
  state.flagged = {};
  state.visits = 0;
  state.postFlags = {};
  state.deepInvestigated = {};
  state.caseHints = [];
  loadWorldExtras(null);
}

const api = {
  state,
  flagAccount,
  isSuspended,
  isFalselyFlagged,
  tickWorld,
  resetState,
  resetWorldState,
  isCaseCompleted,
  markCaseCompleted,
  wrongFlagLimitFor,
  FIRST_CASE_ID,
  FIRST_CASE_EXTRA_STRIKES,
  CORRECT_FLAG_STANDING,
  WRONG_FLAG_STANDING,
  wrongfulFlagCount,
  recordCaseFailure,
  caseFailureCount,
  deepPullLimitFor,
  deepPullsUsed,
  isDeepInvestigated,
  spendDeepPull,
  spendHintPull,
  toggleRedFlag,
  toggleGreenFlag,
  addRedFlagPing,
  isRedFlagged,
  isGreenFlagged,
  redFlagCount,
  flaggedPostIds,
  toggleFollow,
  isFollowing,
  toggleAccountTrust,
  isAccountTrusted,
  canMessage,
  dmFor,
  sendMessage,
  toggleSetting,
  isTutorialTipSeen,
  isGuideTipSeen,
  retireTutorialTip,
  skipTutorial,
  TOUR_IDS,
  MOMENT_IDS,
  isTourSeen,
  markTourSeen,
  isMomentSeen,
  markMomentSeen,
  normalizeTutorial,
  recordCaseAction,
  caseActionCount,
  dismissCaseNudge,
  interrogationFor,
  recordInterrogation,
  markCrossCheck,
  recordClosingReport,
  closingReportFor,
  summarizeReports,
  recordCaseRecord,
  recordSecondOpinion,
  WORLD_EXTRA_KEYS,
  dumpWorldExtras,
  loadWorldExtras,
};

if (typeof module !== "undefined" && module.exports) {
  module.exports = api;
} else {
  window.SKRAPERS_STATE = api;
}

})();

</script>

<script>
// SKRAPERS — Stage 9
// Adaptive ALGO// — the doc's own point (the recommendation system that
// feeds the player is the same kind of optimizing system the Skrapers
// exploit) made mechanical rather than just narrative flavor text. This
// tracks two things the player actually does — which investigate signals
// they look at, and how accurate their flags turn out to be — and feeds
// both back into how hard a freshly generated Endless Internet world is.
//
// Deliberately NOT stage-gated behind cases: Cases 001-003 stay
// hand-authored and fixed (a difficulty ladder needs stable steps to be
// learnable), so adaptation only touches procedurally generated worlds.
// Honest scope note: this is one adaptive knob (jitter, reused from Stage
// 8) driven by one signal (flag accuracy), not the doc's full
// personalized-manipulation vision (per-player content targeting) — that
// would mean generating per-player post text, which is a real content
// pipeline change, not a Stage 9 budget item.

(function () {

const profile = {
  investigations: 0,
  correctFlags: 0,
  wrongFlags: 0,
  signalGlances: { cadence: 0, activity: 0, linguistic: 0 },
  // Stage 13: per-archetype correct-catch counts — the doc's "Skrapers
  // learn from the player" idea (follow-up brainstorm point F), made
  // mechanical below via counterPlayJitter() rather than left as flavor
  // text. Keyed by personalityKey (e.g. "amplifier", "propagator").
  archetypeCatches: {},
  // Round 29 (#3): how well-argued the player's correct CASE flags were —
  // counted from the closing report (ui/feed.js) the player files with
  // every formal flag inside a case. A "clean" catch named real evidence
  // that account actually carries; a "lucky" one got the right account for
  // a reason that isn't what gives it away. Home flags file no report and
  // count in neither.
  cleanCatches: 0,
  luckyCatches: 0,
};

// Called every time the player opens an Investigate panel — signals is
// the array computeSignals() returned for whatever account they looked at.
function recordInvestigate(signals) {
  profile.investigations++;
  signals.forEach((s) => {
    if (/cadence/i.test(s.label)) profile.signalGlances.cadence++;
    else if (/activity/i.test(s.label)) profile.signalGlances.activity++;
    else if (/linguistic/i.test(s.label)) profile.signalGlances.linguistic++;
  });
}

// `acct` is optional (existing call sites that only pass `correct` keep
// working) — when present and the flag was correct, the archetype gets
// credited so counterPlayJitter() below can start compensating for it.
function recordFlag(correct, acct) {
  if (correct) {
    profile.correctFlags++;
    if (acct && acct.personalityKey) {
      profile.archetypeCatches[acct.personalityKey] = (profile.archetypeCatches[acct.personalityKey] || 0) + 1;
    }
  } else {
    profile.wrongFlags++;
  }
}

// Stage 13 arms race: a personality the player has repeatedly caught gets
// extra cadence jitter on FUTURE instances of that same archetype only —
// specifically weakening the signal that's been working against it,
// rather than a blanket difficulty bump across every Skraper. Caps at
// +40 minutes after 4+ catches so it stays a real counter-pressure, not
// an eventual wall.
function counterPlayJitter(personalityKey) {
  const catches = profile.archetypeCatches[personalityKey] || 0;
  return Math.min(catches * 10, 40);
}

// Round 29 (#3): "Investigation accuracy" is the game's third reputation
// axis — "how good you actually are, regardless of how either audience
// feels about you" (game/reputation.js's header). Right-for-the-wrong-reason
// is not the same as good, so a lucky catch now counts HALF a correct flag
// here: still better than a wrong flag, visibly worse than a clean one.
// Chosen over inventing a fourth stat because this is exactly the question
// that axis already exists to answer — and because it's the number
// adaptiveJitter() below scales future worlds by, so a player who wins on
// luck isn't rewarded with harder worlds as if they'd earned them.
const LUCKY_CATCH_WEIGHT = 0.5;
function accuracy() {
  const total = profile.correctFlags + profile.wrongFlags;
  if (total === 0) return null;
  const lucky = Math.min(profile.luckyCatches || 0, profile.correctFlags);
  return Math.max(0, profile.correctFlags - lucky * (1 - LUCKY_CATCH_WEIGHT)) / total;
}

function recordReport(grade) {
  if (grade === "clean") profile.cleanCatches++;
  else if (grade === "lucky") profile.luckyCatches++;
}

// The adaptive knob itself. No data yet -> the same baseline jitter Stage
// 8's Medium case already ships, so a brand-new player isn't punished for
// having no track record. Better-than-even accuracy -> harder worlds,
// same logic Stage 8 already proved (checkJitter.js) shifts the cadence
// signal from a clean HIGH down to MEDIUM.
function adaptiveJitter() {
  const acc = accuracy();
  if (acc === null) return 12;
  if (acc >= 0.8) return 30;
  if (acc >= 0.5) return 20;
  return 10;
}

function dominantSignal() {
  const { cadence, activity, linguistic } = profile.signalGlances;
  if (cadence === 0 && activity === 0 && linguistic === 0) return null;
  const max = Math.max(cadence, activity, linguistic);
  if (max === cadence) return "posting cadence";
  if (max === activity) return "activity-hour pattern";
  return "linguistic consistency";
}

// Deliberately NOT called on every case/world load — the whole point is
// that the algo's read on the player persists across the session, the
// same way a real feed's model of you doesn't reset when you open a new
// tab. Exposed for a possible future "new player" reset action only.
function reset() {
  profile.investigations = 0;
  profile.correctFlags = 0;
  profile.wrongFlags = 0;
  profile.signalGlances = { cadence: 0, activity: 0, linguistic: 0 };
  profile.archetypeCatches = {};
  profile.cleanCatches = 0;
  profile.luckyCatches = 0;
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = { profile, recordInvestigate, recordFlag, recordReport, accuracy, adaptiveJitter, dominantSignal, counterPlayJitter, reset, LUCKY_CATCH_WEIGHT };
} else {
  window.SKRAPERS_ALGO = { profile, recordInvestigate, recordFlag, recordReport, accuracy, adaptiveJitter, dominantSignal, counterPlayJitter, reset, LUCKY_CATCH_WEIGHT };
}

})();

</script>

<script>
// SKRAPERS — Stage 13
// Multi-dimensional reputation. The doc explicitly warns against this
// "simply becoming a linear morality meter" (follow-up brainstorm point 3)
// — which is exactly what a single credibility % is. This adds a second,
// genuinely independent axis that can move the OPPOSITE direction from
// ALGO// standing (game/state.js's existing `credibility`, relabeled in
// the UI as "ALGO// STANDING" rather than duplicated here) — a wrongly
// suspended real person costs the community far more than it costs your
// standing with ALGO//, and staying convincingly undercover (the Trust
// system's EXPLAIN choice) can raise ALGO// standing while quietly
// bleeding community trust. Investigation accuracy (game/algo.js) is the
// third, independent axis: how good you actually are, regardless of how
// either audience currently feels about you.

(function () {

const rep = {
  communityTrust: 100,
};

function clamp(n, lo, hi) {
  return Math.max(lo, Math.min(hi, n));
}

// A correct flag barely moves community trust (removing a real Skraper
// helps the community, but indirectly — they never see the mechanism). A
// wrong flag against a real human still costs more than a right one earns:
// someone's account just got suspended over nothing.
// Stage 31 (#12): rescaled from -14 by the same factor as game/state.js's
// WRONG_FLAG_STANDING (-10 -> -2), so one ordinary mistake is a nick, not a
// crater. The relative shape is kept: a wrongful flag still costs trust a
// little more than it costs standing.
const CORRECT_FLAG_TRUST = 1;
const WRONG_FLAG_TRUST = -3;
function applyFlagOutcome(correct) {
  rep.communityTrust = clamp(rep.communityTrust + (correct ? CORRECT_FLAG_TRUST : WRONG_FLAG_TRUST), 0, 100);
}

function applyDelta(amount) {
  rep.communityTrust = clamp(rep.communityTrust + amount, 0, 100);
}

function reset() {
  rep.communityTrust = 100;
}

function load(saved) {
  if (saved && typeof saved.communityTrust === "number") rep.communityTrust = saved.communityTrust;
  else rep.communityTrust = 100;
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = { rep, applyFlagOutcome, applyDelta, reset, load, CORRECT_FLAG_TRUST, WRONG_FLAG_TRUST };
} else {
  window.SKRAPERS_REPUTATION = { rep, applyFlagOutcome, applyDelta, reset, load, CORRECT_FLAG_TRUST, WRONG_FLAG_TRUST };
}

})();

</script>
