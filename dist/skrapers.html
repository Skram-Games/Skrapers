}
.bait-composer-action:hover { background: rgba(83, 100, 113, 0.08); color: var(--white); }
.bait-composer-action[data-opsec="photo"] .ui-icon { color: #1a9e5c; }
.bait-composer-action[data-opsec="checkin"] .ui-icon { color: var(--amber); }
.bait-composer-action[data-opsec="location"] .ui-icon { color: var(--red); }

/* #13: an alert toast that goes somewhere. */
.skrapers-toast.linked { padding-bottom: 10px; }
.skrapers-toast-cta {
  display: block;
  margin-top: 6px;
  font-family: "Space Grotesk", monospace;
  font-size: 11px;
  letter-spacing: 0.03em;
  color: var(--blue);
  text-decoration: underline;
  text-underline-offset: 2px;
}

/* #11: the "What to check" reference card on a case's feed / Case File. */
.what-to-check {
  margin: 0 18px 12px;
  border: 1px solid rgba(83, 100, 113, 0.22);
  border-radius: var(--radius-sm);
  background: rgba(83, 100, 113, 0.04);
  font-size: 12.5px;
  line-height: 1.45;
}
.what-to-check summary {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 9px 12px;
  cursor: pointer;
  list-style: none;
  font-weight: 600;
  color: var(--white);
}
.what-to-check summary::-webkit-details-marker { display: none; }
.what-to-check summary .ui-icon { color: var(--blue); }
.what-to-check summary::after {
  content: "";
  margin-left: auto;
  width: 7px;
  height: 7px;
  border-right: 1.8px solid var(--grey);
  border-bottom: 1.8px solid var(--grey);
  transform: rotate(45deg);
  transition: transform 0.15s ease;
}
.what-to-check[open] summary::after { transform: rotate(-135deg); }
.what-to-check-sub { font-weight: 400; color: var(--grey); font-size: 11.5px; }
.what-to-check-body { padding: 0 12px 10px; }
.what-to-check-row { display: flex; gap: 8px; padding: 5px 0; border-top: 1px solid rgba(83, 100, 113, 0.1); }
.what-to-check-row b { color: var(--white); }
.what-to-check-icon { color: var(--blue); flex: 0 0 auto; margin-top: 1px; }
.what-to-check-foot { font-size: 11px; color: var(--grey); margin-top: 6px; font-style: italic; }

/* #10: Case Board texture — cork, tacks, paper. Colour tokens for the paper
   surfaces, re-toned for dark mode below so text stays legible. */
#app {
  --paper: #fffbea;
  --paper-line: rgba(80, 130, 190, 0.22);
  --paper-margin: rgba(214, 60, 60, 0.35);
  --paper-ink: #2b2415;
  --card-paper: #fdfaf2;
}
#app.dark-mode {
  --paper: #1f2328;
  --paper-line: rgba(120, 160, 210, 0.16);
  --paper-margin: rgba(230, 90, 90, 0.35);
  --paper-ink: #ece6d6;
  --card-paper: #1b1f24;
}
/* a wooden frame around the cork, and a little more grain */
.corkboard-viewport {
  border: 6px solid #7a4f24;
  border-image: linear-gradient(135deg, #8d5d2c, #5e3a17 45%, #8a5a2a 70%, #5a3714) 1;
  border-radius: 4px;
}
.corkboard-viewport::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(rgba(255, 235, 200, 0.14) 0.6px, transparent 1.2px),
    radial-gradient(rgba(60, 35, 10, 0.12) 0.7px, transparent 1.4px);
  background-size: 7px 7px, 11px 11px;
  background-position: 0 0, 3px 5px;
}
/* each account hangs on the cork like a pinned index card */
.corkboard-pin-icon { position: relative; z-index: 1; }
.corkboard-pin-label {
  background: #fdfaf2;
  color: #3a2408;
  border-radius: 1px;
  box-shadow: 0 2px 3px rgba(0, 0, 0, 0.3);
  transform: rotate(-1.5deg);
  font-weight: 600;
}
.corkboard-pin:nth-child(even) .corkboard-pin-label { transform: rotate(1.5deg); }
/* notepad paper for the investigator's notes on the board (and the Case
   File, which shares the board's note editor) */
.pin-notes-panel,
.pin-note-board {
  background-color: var(--paper);
  background-image:
    linear-gradient(90deg, transparent 26px, var(--paper-margin) 26px, var(--paper-margin) 27.5px, transparent 27.5px),
    repeating-linear-gradient(to bottom, transparent 0, transparent 21px, var(--paper-line) 21px, var(--paper-line) 22px);
  background-position: 0 0, 0 8px;
  color: var(--paper-ink);
}
.pin-notes-panel {
  border: 1px solid rgba(120, 100, 60, 0.3);
  border-radius: 3px;
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
  padding-left: 36px;
  position: relative;
}
/* a clip at the top of the notepad */
.pin-notes-panel::before {
  content: "";
  position: absolute;
  top: -7px;
  left: 50%;
  transform: translateX(-50%);
  width: 64px;
  height: 14px;
  border-radius: 4px 4px 2px 2px;
  background: linear-gradient(#a8adb3, #6c737a);
  box-shadow: 0 2px 3px rgba(0, 0, 0, 0.3);
}
.pin-notes-panel h4 { color: #b0322b; }
.pin-note-board { border-style: solid; border-color: rgba(120, 100, 60, 0.25); padding-left: 36px; }
.pin-note-board .pin-note-text,
.pin-notes-panel .pin-notes-name { color: var(--paper-ink); }
.pin-note-board .pin-note-text { line-height: 22px; }
/* evidence links read like an index card */
.pin-links-panel {
  background-color: var(--card-paper);
  background-image: linear-gradient(to bottom, transparent 34px, rgba(214, 60, 60, 0.35) 34px, rgba(214, 60, 60, 0.35) 35.5px, transparent 35.5px);
  border: 1px solid rgba(120, 100, 60, 0.25);
  border-radius: 3px;
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
}
/* inside the notepad panel, each pin's own note is just more of the same
   page — no second sheet of paper, no second margin line */
.pin-notes-panel .pin-note-board {
  background: transparent;
  border: none;
  padding: 4px 0 0;
}

/* ===========================================================================
   Stage 32: THE MARKETPLACE — a two-column grid of listing cards (the
   approved brand/marketplace/example_listing.html mockup, on the game's own
   tokens), one listing's detail view, and the Inbox's Messages /
   Notifications switch. Every colour below comes from the palette variables
   or has an explicit #app.dark-mode counterpart further down.
   =========================================================================== */
#app {
  --market-card-bg: var(--navy);
  --market-card-border: rgba(83, 100, 113, 0.18);
  --market-card-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
  --market-ink: #141413;              /* icon ink on the pastel tiles — tiles stay light in both themes */
  --market-tag-bg: rgba(20, 20, 19, 0.72);
  --market-pin-bg: rgba(255, 255, 255, 0.92);
  --market-pin-border: rgba(83, 100, 113, 0.25);
  --market-free: #16a34a;
}
#app.dark-mode {
  --market-card-bg: #16202a;
  --market-card-border: rgba(139, 152, 165, 0.22);
  --market-card-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
  --market-tag-bg: rgba(0, 0, 0, 0.62);
  --market-pin-bg: rgba(15, 20, 25, 0.86);
  --market-pin-border: rgba(139, 152, 165, 0.4);
  --market-free: #4ade80;
}

.market-head { margin: 14px 18px 10px; }
.market-kicker {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: "Space Grotesk", monospace;
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--blue);
}
.market-sub { font-size: 12.5px; line-height: 1.5; color: var(--grey); margin-top: 4px; }
.market-hook { border-left-color: var(--blue); background: rgba(29, 155, 240, 0.06); }
.market-hook .focus-nudge-icon, .market-hook .focus-nudge-kicker { color: var(--blue); }

.market-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  padding: 2px 14px 24px;
}
.market-card {
  position: relative;
  background: var(--market-card-bg);
  border: 1px solid var(--market-card-border);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: var(--market-card-shadow);
  cursor: pointer;
  transition: transform 0.12s ease, border-color 0.15s ease;
  min-width: 0;
}
.market-card:hover { border-color: rgba(29, 155, 240, 0.45); }
.market-card:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.market-card.suspended { opacity: 0.45; }

.market-thumb {
  position: relative;
  aspect-ratio: 5 / 4;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--market-ink);
}
.market-thumb .market-icon { width: 46%; height: auto; max-width: 84px; }
.market-week-tag {
  position: absolute;
  top: 8px;
  left: 8px;
  background: var(--market-tag-bg);
  color: #fff;
  font-size: 10px;
  font-weight: 600;
  padding: 3px 7px;
  border-radius: 20px;
  letter-spacing: 0.02em;
  pointer-events: none;
}
.market-sold-tag {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%) rotate(-4deg);
  background: var(--red);
  color: #fff;
  font-family: "Space Grotesk", monospace;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 4px 12px;
  border-radius: 6px;
}
.market-pin-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--market-pin-bg);
  border: 1px solid var(--market-pin-border);
  color: var(--blue);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}
.market-pin-btn .ui-icon { width: 15px; height: 15px; vertical-align: middle; }
.market-pin-btn:hover { border-color: var(--blue); }
.market-pin-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }
.market-pin-btn.active .ui-icon { fill: currentColor; fill-opacity: 0.3; }

.market-body { padding: 9px 11px 11px; }
.market-body .sponsored-label { margin: 0 0 3px; font-size: 10.5px; }
.market-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--white);
  line-height: 1.3;
  margin-bottom: 4px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  overflow-wrap: anywhere;
}
.market-price { font-size: 14.5px; font-weight: 700; color: var(--white); }
.market-price.free, .market-detail-price.free { color: var(--market-free); }
.market-fee { font-weight: 500; color: var(--grey); font-size: 11px; }
.market-seller {
  font-size: 11px;
  color: var(--grey);
  margin-top: 5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* one listing */
.market-detail { margin: 12px 18px 20px; background: var(--market-card-bg); border: 1px solid var(--market-card-border); border-radius: var(--radius); overflow: hidden; }
.market-detail .market-thumb { aspect-ratio: 16 / 10; }
.market-detail .market-thumb .market-icon { width: 34%; max-width: 150px; }
.market-detail-body { padding: 14px 16px 16px; }
.market-detail-title { font-size: 17px; font-weight: 700; line-height: 1.35; color: var(--white); margin: 2px 0 6px; overflow-wrap: anywhere; }
.market-detail-price-btn {
  display: block;
  background: none;
  border: none;
  padding: 0;
  margin: 0;
  text-align: left;
  cursor: pointer;
  font: inherit;
  color: inherit;
}
.market-detail-price { font-size: 20px; font-weight: 700; color: var(--white); }
.market-detail-price .market-fee { font-size: 12.5px; }
.market-detail-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--grey); margin: 8px 0 12px; }
.market-seller-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-top: 1px solid rgba(83, 100, 113, 0.14);
  border-bottom: 1px solid rgba(83, 100, 113, 0.14);
  cursor: pointer;
}
.market-seller-row .avatar { width: 38px; height: 38px; font-size: 13px; }
.market-seller-row:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.market-seller-id { flex: 1; min-width: 0; font-size: 13.5px; color: var(--white); }
.market-seller-handle { color: var(--grey); font-size: 12.5px; }
.market-seller-sub { font-size: 11.5px; color: var(--blue); margin-top: 2px; }
.market-message { margin-top: 12px; }
.market-ask-btn { margin-top: 0; width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.market-fine { font-size: 11.5px; color: var(--grey); margin-top: 7px; line-height: 1.45; }
.market-waiting { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--grey); font-style: italic; padding: 8px 0; }
.case-market-hook { display: flex; align-items: flex-start; gap: 6px; }
.case-market-hook .case-hint-btn { margin-top: 6px; display: inline-flex; align-items: center; gap: 5px; }

/* the Inbox's two sides */
.inbox-tabs { margin-top: 12px; }
.inbox-tab-count {
  min-width: 17px;
  height: 17px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--red);
  color: #fff;
  font-size: 10.5px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}
.inbox-mark-all {
  background: transparent;
  border: 1px solid var(--grey);
  color: var(--grey);
  border-radius: 999px;
  padding: 6px 11px;
  font-size: 11px;
  font-family: "Inter", sans-serif;
  cursor: pointer;
  white-space: nowrap;
}
.inbox-mark-all:disabled { opacity: 0.5; cursor: default; }

/* dark mode: the pieces that don't already follow a palette variable */
#app.dark-mode .market-card:hover { border-color: rgba(29, 155, 240, 0.6); }
#app.dark-mode .market-seller-row { border-color: rgba(139, 152, 165, 0.2); }
#app.dark-mode .market-thumb { filter: saturate(0.9) brightness(0.94); }
#app.dark-mode .feed-mode-btn.active { box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5); }

/* high contrast: the same stronger borders every other surface gets */
#app.high-contrast .market-card,
#app.high-contrast .market-detail,
#app.high-contrast .market-pin-btn {
  border-color: currentColor !important;
  border-width: 2px !important;
}
#app.high-contrast .market-title,
#app.high-contrast .market-seller { font-weight: 600; }

/* ===========================================================================
   Stage 33: SPOTLIGHT TUTORIALS (ui/feed.js's startTour). One fixed overlay
   on <body>: a "hole" whose huge blurless box-shadow IS the dimming (it
   paints everything outside its own box), plus a speech bubble. Ported from
   Skrambeasts; recoloured to SKRAPERS' own palette variables, which the
   overlay picks up in dark mode / high contrast through the same
   body:has(#app.…) > .tour-overlay selectors the modals use (it sits outside
   #app, so it can't inherit them).
   =========================================================================== */
.tour-overlay {
  --tour-dim: rgba(8, 10, 15, 0.6);
  position: fixed;
  inset: 0;
  z-index: 9999;
  pointer-events: auto;
  touch-action: none;
  color: var(--white);
  font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
}
body:has(#app.dark-mode) > .tour-overlay { --tour-dim: rgba(0, 0, 0, 0.72); }
.tour-hole {
  position: fixed;
  border-radius: 14px;
  box-shadow: 0 0 0 2px var(--blue), 0 0 0 9999px var(--tour-dim);
  pointer-events: none;
  transition: top 0.25s ease, left 0.25s ease, width 0.25s ease, height 0.25s ease;
}
.tour-hole.empty { box-shadow: 0 0 0 9999px var(--tour-dim); } /* nothing to point at: dim only, no ring */
.tour-bubble {
  position: fixed;
  width: min(284px, calc(100vw - 20px));
  box-sizing: border-box;
  background: var(--navy);
  color: var(--white);
  border: 1.5px solid var(--blue);
  border-radius: 14px;
  padding: 12px 13px 11px;
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.32);
  z-index: 10000;
  opacity: 0;
  transition: opacity 0.12s ease;
}
.tour-bubble.center { width: min(320px, calc(100vw - 32px)); }
body:has(#app.dark-mode) > .tour-overlay .tour-bubble { box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); }
.tour-kicker {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: "Space Grotesk", monospace;
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--blue);
}
.tour-kicker .ui-icon { width: 13px; height: 13px; flex-shrink: 0; }
.tour-title {
  font-family: "Space Grotesk", monospace;
  font-size: 15px;
  font-weight: 700;
  line-height: 1.3;
  margin-top: 4px;
}
.tour-text { font-size: 13.5px; line-height: 1.5; margin-top: 4px; }
.tour-text b { font-weight: 600; }
.tour-actions { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 10px; }
.tour-btn {
  font-family: "Inter", sans-serif;
  font-size: 12.5px;
  font-weight: 600;
  padding: 6px 14px;
  border-radius: 999px;
  border: 1px solid var(--blue);
  background: var(--blue);
  color: #fff;
  cursor: pointer;
}
.tour-btn.subtle { margin-right: auto; background: transparent; color: var(--grey); border-color: rgba(83, 100, 113, 0.4); font-weight: 500; }
body:has(#app.dark-mode) > .tour-overlay .tour-btn.subtle { border-color: rgba(139, 152, 165, 0.45); }
.tour-btn:hover { filter: brightness(1.08); }
.tour-btn.subtle:hover { color: var(--white); filter: none; }
.tour-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.tour-btn.subtle:focus-visible { outline-color: var(--grey); }
/* The pointer: a 20px triangle in the bubble's own fill, over a 24px one in
   its border colour, so the outline carries on round the point. Its bottom
   edge overlaps the bubble's border by the border's width so there's no seam. */
.tour-arrow { position: absolute; width: 0; height: 0; }
.tour-arrow-up {
  top: -8.5px;
  border-left: 10px solid transparent;
  border-right: 10px solid transparent;
  border-bottom: 10px solid var(--navy);
}
.tour-arrow-up::after {
  content: "";
  position: absolute;
  top: -2px;
  left: -12px;
  width: 0;
  height: 0;
  border-left: 12px solid transparent;
  border-right: 12px solid transparent;
  border-bottom: 12px solid var(--blue);
  z-index: -1;
}
.tour-arrow-down {
  bottom: -8.5px;
  border-left: 10px solid transparent;
  border-right: 10px solid transparent;
  border-top: 10px solid var(--navy);
}
.tour-arrow-down::after {
  content: "";
  position: absolute;
  bottom: -2px;
  left: -12px;
  width: 0;
  height: 0;
  border-left: 12px solid transparent;
  border-right: 12px solid transparent;
  border-top: 12px solid var(--blue);
  z-index: -1;
}
/* high contrast: a heavier outline, stronger text */
body:has(#app.high-contrast) > .tour-overlay .tour-bubble { border-width: 2.5px; }
body:has(#app.high-contrast) > .tour-overlay .tour-text { font-weight: 500; }
body:has(#app.high-contrast) > .tour-overlay .tour-hole { box-shadow: 0 0 0 3px var(--blue), 0 0 0 9999px var(--tour-dim); }
body:has(#app.high-contrast) > .tour-overlay .tour-hole.empty { box-shadow: 0 0 0 9999px var(--tour-dim); }
body:has(#app.high-contrast) > .tour-overlay .tour-btn.subtle { border-color: currentColor; }
@media (prefers-reduced-motion: reduce) {
  .tour-hole,
  .tour-bubble { transition: none; }
}

/* Stage 33: the icon key's "?" beside the player profile's heading (the
   opening tour's Profile stop). */
.player-profile-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.player-profile-head h4 { margin: 0; }

/* Stage 33: Settings -> Replay tutorial. The Settings card grew, so it now
   scrolls inside itself on a short screen rather than running off it. */
.settings-main-modal { max-height: calc(100vh - 40px); overflow-y: auto; }
.settings-replay {
  margin-top: 4px;
  padding-top: 12px;
  border-top: 1px solid rgba(83, 100, 113, 0.15);
}
.settings-section-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: "Space Grotesk", monospace;
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 2px;
}
.settings-replay-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 2px;
  font-size: 14px;
}
.settings-replay-row .settings-toggle-label { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.settings-replay-row .settings-toggle-sub { font-size: 11.5px; color: var(--grey); }
.settings-replay-btn {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: "Inter", sans-serif;
  font-size: 12px;
  font-weight: 600;
  padding: 6px 11px;
  border-radius: 999px;
  border: 1px solid var(--blue);
  background: transparent;
  color: var(--blue);
  cursor: pointer;
  white-space: nowrap;
}
.settings-replay-btn:hover { background: rgba(29, 155, 240, 0.1); }
.settings-replay-note { font-size: 11px; color: var(--grey); margin-top: 2px; font-style: italic; }
body:has(#app.dark-mode) > .settings-overlay .settings-replay { border-top-color: rgba(139, 152, 165, 0.2); }
body:has(#app.high-contrast) > .settings-overlay .settings-replay-btn { border-width: 2px; }

</style>
</head>

<div id="app"></div>

<!-- ===== data/personalities.js ===== -->
<script>
// SKRAPERS — Stage 0 content-generation prototype
// Personality definitions: each one is a distinct set of topics, sentence
// habits, vocabulary and quirks used by simulation/generate.js to produce posts.
// This file holds ONLY data — no generation logic — so voices can be tuned
// by editing pools here without touching the generator.

(function () {
const HUMAN_PERSONALITIES = {
  lurker: {
    label: "Lurker (human)",
    postingRate: "low", // rarely posts original content, mostly reacts
    activeHours: [9, 23], // wide, unremarkable waking-hours window
    topics: ["whatever's on the feed", "something someone else said"],
    sentenceLengths: [3, 4, 5, 6], // short
    punctuation: "minimal", // often no full stop, no capital start
    emojiRate: 0.05,
    typoRate: 0.08,
    capsStyle: "lowercase-lean", // sometimes skips capitals entirely
    openers: ["", "", "honestly", "ngl", "wait", "lol", "ok but", "hm", "eh", "so apparently", "anyway"],
    fillers: ["kind of", "sort of", "i guess", "idk", "eh", "not sure tbh", "whatever that means", "no clue honestly"],
    closers: ["", "", "", "anyway", "whatever", "shrug", "meh", "moving on", "who cares tbh"],
    vocab: ["thing", "stuff", "this", "that", "it"],
    // Bio pools, one per personality/archetype (human AND Skraper) — Feature
    // round ("every profile needs a bio"). Same template+word-pool
    // convention as TEMPLATES in simulation/generate.js: a short bank of
    // hand-authored 1-2 sentence bio shapes, an optional {topic} slot filled
    // from this personality's own topics/topicPool, picked by
    // generateBio() (simulation/generate.js). Human bios read like an
    // ordinary person wrote them; Skraper archetype bios can (not must)
    // carry a subtle, non-conclusive tell consistent with that archetype's
    // established voice — never a giveaway on their own.
    bioPool: ["just here for the discourse tbh", "mostly here to read, not post", "professional lurker, occasional commenter", "here for {topic}, mostly just scrolling", "no thoughts, just vibes and a feed"],
    topicPool: [
      "the thing everyone's posting about",
      "that video",
      "this post",
      "the news today",
      "my feed rn",
      "that whole thing from earlier",
      "the group chat drama",
      "that account everyone's talking about",
      "whatever this trend is",
      "the thing from this morning",
      "that reply someone left",
      "the thing my sibling sent me",
      "whatever's blowing up rn",
      "that screenshot going around",
    ],
    quirks: ["drops final punctuation", "rarely starts with a capital", "very short replies"],
  },

  obsessive: {
    label: "Obsessive hobbyist (human)",
    postingRate: "high",
    activeHours: [21, 2], // late night, wraps past midnight
    topics: ["vintage synthesizers", "competitive birdwatching", "1970s formula 1", "sourdough fermentation science", "obscure board game history", "amateur radio propagation", "pre-war typewriter restoration", "deep-sea cable mapping", "regional folk instrument tuning systems", "18th century clockmaking"],
    sentenceLengths: [14, 18, 22, 25], // long, detail-heavy
    punctuation: "heavy", // semicolons, em-dashes, parenthetical asides
    emojiRate: 0.02,
    typoRate: 0.03,
    capsStyle: "occasional-emphasis", // ALL CAPS for one key word
    openers: ["Okay so", "Unpopular opinion but", "I need to say this", "Correction from earlier —", "Genuinely can't let this go —", "Quick addendum:"],
    fillers: ["specifically", "which is important because", "and I cannot stress this enough", "technically speaking", "for what it's worth", "as I've said before"],
    closers: ["Do with that what you will.", "Happy to be proven wrong but I doubt it.", "Anyway, back to the archive.", "Sources available if anyone actually wants them.", "Not that anyone asked."],
    vocab: ["frankly", "objectively", "the actual data shows", "if you know, you know"],
    quirks: ["cites specific numbers/years/models", "one ALL CAPS word per post for emphasis", "assumes deep shared context with reader"],
    bioPool: ["Deep in {topic} and unwilling to apologize for it.", "If it's about {topic}, I probably have an opinion.", "Collector, hobbyist, occasional bore about {topic}.", "Here for {topic}. Sources available on request."],
  },

  teenager: {
    label: "Teenager (human)",
    postingRate: "very high",
    activeHours: [15, 23], // after school through late evening
    topics: ["a show everyone's watching", "a group chat drama", "a song stuck in their head", "school starting again", "a group project going badly", "a new phone case", "a teacher's weird rule", "a friend's situationship"],
    sentenceLengths: [4, 6, 8, 10],
    punctuation: "sparse-expressive", // lowercase, repeated letters, no full stops
    emojiRate: 0.35,
    typoRate: 0.1,
    capsStyle: "lowercase-default",
    openers: ["not me", "the way", "why did", "i cannot believe", "bestie"],

function fillTemplate(tpl, p) {
  return tpl
    .replace("{opener}", pick(p.openers))
    .replace("{topic}", pick(p.topicPool || p.topics))
    .replace("{filler}", pick(p.fillers))
    .replace("{closer}", pick(p.closers))
    .replace("{vocab}", pick(p.vocab))
    .replace(/\s+/g, " ")
    .trim();
}

function applyCapsStyle(text, p) {
  if (p.capsStyle === "lowercase-lean" && maybe(0.7)) {
    text = text.charAt(0).toLowerCase() + text.slice(1);
  }
  if (p.capsStyle === "lowercase-default") {
    text = text.toLowerCase();
  }
  if (p.capsStyle === "occasional-emphasis" && maybe(0.4)) {
    const words = text.split(" ");
    const idx = Math.floor(Math.random() * words.length);
    words[idx] = words[idx].toUpperCase();
    text = words.join(" ");
  }
  return text;
}

function applyPunctuation(text, p) {
  if (p.punctuation === "minimal" && maybe(0.6)) {
    text = text.replace(/[.!?]+$/, "");
  }
  if (p.punctuation === "sparse-expressive") {
    text = text.replace(/[.!?]+$/, maybe(0.5) ? "" : "...");
    if (maybe(0.3)) {
      text = text.replace(/\b(so|no|wait)\b/i, (m) => m + m.slice(-1).repeat(2));
    }
  }
  return text;
}

function applyEmoji(text, p) {
  const emojis = ["😭", "💀", "🔥", "😂", "👀", "✨", "🙄"];
  if (maybe(p.emojiRate)) {
    text = `${text} ${pick(emojis)}`;
  }
  return text;
}

function applyTypo(text, p) {
  if (maybe(p.typoRate)) {
    const words = text.split(" ");
    const idx = Math.floor(Math.random() * words.length);
    const w = words[idx];
    if (w.length > 3) {
      const pos = Math.floor(Math.random() * (w.length - 1)) + 1;
      words[idx] = w.slice(0, pos - 1) + w.slice(pos, pos + 1) + w.slice(pos - 1, pos) + w.slice(pos + 1);
    }
    text = words.join(" ");
  }
  return text;
}

function generatePost(key, p) {
  const bank = TEMPLATES[key];
  let text = fillTemplate(pick(bank), p);
  text = applyCapsStyle(text, p);
  text = applyPunctuation(text, p);
  text = applyEmoji(text, p);
  text = applyTypo(text, p);
  return text;
}

// Feature round: a real human's organic small-business promo post — built
// from small_biz's OWN promoOpeners/productPool/promoClosers pools (see
// data/personalities.js), not AD_ARCHETYPES, so it stays in this specific
// account's personal voice rather than reading like ad copy. Distinct from
// generateAdPost below on purpose: this is the human counterpart the
// design explicitly asked for, not a variant of the ad system.
function generatePromoPost(p) {
  const opener = pick(p.promoOpeners || p.openers);
  const product = pick(p.productPool || p.topicPool || p.topics);
  const closer = pick(p.promoClosers || p.closers);
  let text = `${opener} ${product}. ${closer}`.replace(/\s+/g, " ").trim();
  text = applyEmoji(text, p);
  text = applyTypo(text, p);
  return text;
}

// Feature round: sponsored ad copy for the adbot Skraper archetype — pulls
// from AD_ARCHETYPES (data/personalities.js) rather than the generic
// TEMPLATES bank, since a product pitch + CTA has its own fixed shape.
// Returns the generated text plus which CSS-drawn placeholder card
// (ui/feed.js/ui/styles.css) this ad should render as.
function generateAdPost(categoryKey, p) {
  const categoryKeys = Object.keys(AD_ARCHETYPES);
  const cat = AD_ARCHETYPES[categoryKey] || AD_ARCHETYPES[pick(categoryKeys)];
  const opener = p ? pick(p.openers) : "Introducing";
  const product = pick(cat.productNames);
  const pitch = pick(cat.pitches);
  const cta = pick(cat.ctas);
  let text = `${opener} ${product} — ${pitch}. ${cta}`.replace(/\s+/g, " ").trim();
  if (p) text = applyEmoji(text, p);
  return { text, imageStyle: cat.imageStyle, category: cat.label };
}

// Feature round ("every profile needs a bio"): a short 1-2 sentence bio for
// a procedurally-generated account, drawn from that personality/archetype's
// own bioPool (data/personalities.js) — same template+word-pool convention
// as generatePost above, just a single {topic} slot rather than a full
// sentence structure. Falls back to a plain line for any personality that
// doesn't define bioPool (shouldn't happen, but keeps this from ever
// rendering "undefined").
function generateBio(key, p) {
  const bank = (p && p.bioPool) || ["No bio yet."];
  const tpl = pick(bank);
  return tpl
    .replace("{topic}", pick(p.topicPool || p.topics || [""]))
    .replace(/\s+/g, " ")
    .trim();
}

function generateSample(count = 10) {
  const all = { ...HUMAN_PERSONALITIES, ...SKRAPER_TYPES };
  const results = {};
  for (const [key, p] of Object.entries(all)) {
    results[key] = {
      label: p.label,
      posts: Array.from({ length: count }, () => generatePost(key, p)),
    };
  }
  return results;
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = { generatePost, generateSample, generatePromoPost, generateAdPost, generateBio };
  if (require.main === module) {
    const sample = generateSample(10);
    console.log(JSON.stringify(sample, null, 2));
  }
} else {
  window.SKRAPERS_GENERATE = { generatePost, generateSample, generatePromoPost, generateAdPost, generateBio };
}
})();

</script>

<script>
// SKRAPERS — Stage 1 (accounts) + Stage 2 (behaviour rules)
// 10 accounts, mix of human personality types (with one deliberately
// odd-but-innocent human as an early red herring) plus one Echo Skraper.
// Posts are generated from each personality's rules — content (Stage 0)
// AND now timing: each personality posts within its own activeHours
// window, so posting-time pattern is itself a behavioural signal, not
// just decoration. Echo's activeHours span the full 24h with no dip —
// per the design doc's own "strange activity hours" clue (section 9).

// Places a post `minsAgo` such that its resulting hour-of-day falls
// inside [start, end) of the personality's activeHours (wrapping past
// midnight when start > end, e.g. the Obsessive's 21→2 window).
function pickActiveMinsAgo(activeHours, maxDaysBack) {
  const [start, end] = activeHours;
  const spanHours = end > start ? end - start : 24 - start + end;
  for (let attempt = 0; attempt < 20; attempt++) {
    const daysBack = Math.floor(Math.random() * maxDaysBack);
    const hourOffset = Math.random() * spanHours;
    const hourOfDay = (start + hourOffset) % 24;
    const now = new Date();
    const candidate = new Date(now);
    candidate.setDate(now.getDate() - daysBack);
    candidate.setHours(Math.floor(hourOfDay), Math.floor(Math.random() * 60), 0, 0);
    const minsAgo = Math.round((now - candidate) / 60000);
    if (minsAgo > 0) return minsAgo;
  }
  return Math.floor(Math.random() * maxDaysBack * 24 * 60); // fallback, shouldn't trigger
}

// Stage 2-7 testing) means the Skraper's interval is perfectly regular —
// an obvious tell. A higher value adds random noise to each interval, so

  // Feature round ("every profile needs a bio"): hand-authored, consistent

  const roster = [

    { id: "a6", name: "Tomasz Wieczorek", handle: "@tomaszw", personalityKey: "obsessive", isSkraper: false, followers: 233, joined: "Feb 2022", following: ["a2"], bio: "Amateur radio enthusiast. Ask me about propagation, I dare you." },
    { id: "a7", name: "Second Breakfast Society", handle: "@2ndbreakfast", personalityKey: "teenager", isSkraper: false, followers: 5602, joined: "Jul 2024", following: ["a3"], note: "odd but innocent — meme account, high posting rate, reads suspicious at a glance", bio: "unofficial society for the appreciation of a second breakfast. no further questions." },

<script>
// SKRAPERS — Stage 3
// Computes investigation signals FROM REAL ACCOUNT DATA — no hardcoded
// verdicts, no hidden "isSkraper" shortcut read here. This is the
// confidence-not-certainty display the design doc calls for (section 9-10):
// qualitative signals the player weighs themselves, not a percentage or a
// SKRAPER DETECTED banner.
//
// Deliberately honest limitation, worth keeping visible rather than
// hiding: because every account (human and Skraper alike) is generated by
// the same Stage 0 template system, a signal like "sentence-length
// consistency" will NOT cleanly separate the two — which is thematically
// correct (the doc's own point in section 10-11: paranoia should not
// equal success, false positives have to be genuinely possible) but is
// also just an honest property of this prototype's content pipeline at
// this stage, not a solved detection problem.

(function () {

function cadenceSignal(posts) {
  if (posts.length < 3) {
    return { label: "Posting cadence", value: "not enough posts to judge", level: "low" };
  }
  const sorted = [...posts].sort((a, b) => a.timestamp - b.timestamp);
  const intervals = [];
  for (let i = 1; i < sorted.length; i++) intervals.push(sorted[i].timestamp - sorted[i - 1].timestamp);
  const mean = intervals.reduce((a, b) => a + b, 0) / intervals.length;
  const variance = intervals.reduce((a, b) => a + (b - mean) ** 2, 0) / intervals.length;
  const cv = mean > 0 ? Math.sqrt(variance) / mean : 0;
  // Low coefficient of variation = mechanically regular intervals = suspicious.
  const level = cv < 0.15 ? "high" : cv < 0.5 ? "medium" : "low";
  return { label: "Posting cadence", value: `interval variance ${(cv * 100).toFixed(0)}%`, level };
}

function activityPatternSignal(posts) {
  // Guard added after Stage 7 testing: a brand-new account with exactly
  // one post always has spreadRatio = 1/1 = 1.0, reading as maximally
  // suspicious purely from having too little data — a false-positive
  // generator built into the tool itself, not organic noise. The other
  // two signals already had this guard; this one didn't.
  if (posts.length < 3) {
    return { label: "Activity-hour pattern", value: "not enough posts to judge", level: "low" };
  }
  const hours = posts.map((p) => new Date(p.timestamp).getHours());
  const uniqueHours = new Set(hours).size;
  const spreadRatio = posts.length > 0 ? uniqueHours / posts.length : 0;
  // Posts scattered across many distinct hours with no clustering = no
  // circadian rhythm = suspicious (mirrors the doc's "strange activity
  // hours" clue in section 9).
  const level = spreadRatio > 0.85 ? "high" : spreadRatio > 0.5 ? "medium" : "low";
  return { label: "Activity-hour pattern", value: `${uniqueHours} distinct hours across ${posts.length} posts`, level };
}

function linguisticConsistencySignal(posts) {
  if (posts.length < 3) {
    return { label: "Linguistic consistency", value: "not enough posts to judge", level: "low" };
  }
  const lengths = posts.map((p) => p.text.length);
  const mean = lengths.reduce((a, b) => a + b, 0) / lengths.length;
  const variance = lengths.reduce((a, b) => a + (b - mean) ** 2, 0) / lengths.length;
  const cv = mean > 0 ? Math.sqrt(variance) / mean : 0;
  // Unlike the other two signals, low variance here is ambiguous by
  // design (see file header) — surfaced as medium rather than a false
  // "high" confidence claim the underlying data doesn't support.
  const level = cv < 0.1 ? "medium" : cv < 0.3 ? "low" : "low";
  return { label: "Linguistic consistency", value: `post-length variance ${(cv * 100).toFixed(0)}%`, level };
}

function computeSignals(account) {
  return [
    cadenceSignal(account.posts),
    activityPatternSignal(account.posts),
    linguisticConsistencySignal(account.posts),
  ];
}

// ===========================================================================
// Round 28 (#2/#3/#4): the DEEP signals — what a deep-investigate pull
// unlocks. Same contract as computeSignals above: every reading is computed
// from the account's own data (its `deep` record, generated at world-build
// time by simulation/worldgen.js's attachDeepSignals, and the follow graph),
// never from isSkraper or from the generator's own list of which tells it
// planted. Same qualitative low/medium/high shape, same "no verdicts" rule:
// a night-shift worker really does peak at 3am, a family really does share
// one photo, so every one of these can and does misfire on a real person.
// ===========================================================================

// In-fiction: the date ALGO// opened to the public. Chosen to sit before
// every hand-authored join date already in the game (the oldest is an
// event announcer's "Jan 2011", game/events.js), so no existing account is
// retroactively impossible. A server record older than this cannot be real.
const ALGO_LAUNCH = { year: 2010, month: 8, label: "Sep 2010" };
const MONTH_NAMES = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

function parseMonthYear(str) {
  const m = /^([A-Z][a-z]{2}) (\d{4})$/.exec(str || "");
  if (!m) return null;
  const month = MONTH_NAMES.indexOf(m[1]);
  return month === -1 ? null : { year: parseInt(m[2], 10), month };
}

function formatUtcOffset(utc) {
  const sign = utc < 0 ? "−" : "+";
  const abs = Math.abs(utc);
  const h = Math.floor(abs);
  const mins = Math.round((abs - h) * 60);
  return `UTC${sign}${h}${mins ? `:${String(mins).padStart(2, "0")}` : ""}`;
}

function hourLabel(h) {
  return `${String(((Math.round(h) % 24) + 24) % 24).padStart(2, "0")}:00`;
}

// Stated location vs. when the account is actually active, in that
// location's own local time (from the server-side session log — the feed's
// own timestamps are shown in the viewer's clock, so this is the one place
// the account's claimed timezone is checked at all).
function timezoneSignal(deep, account) {
  if (!deep.location) return null;
  const where = `${deep.location.city} (${formatUtcOffset(deep.location.utc)})`;
  if (typeof deep.activityPeak !== "number" || !(account.posts || []).length) {
    return { key: "timezone", label: "Stated location vs. activity", value: `${where} — no session activity to compare`, level: "low" };
  }
  const h = ((deep.activityPeak % 24) + 24) % 24;
  const level = h >= 1 && h <= 5 ? "high" : h === 0 || h === 6 ? "medium" : "low";
  const note = level === "high" ? " — the middle of the night where it says it lives" : level === "medium" ? " — unusually late or early" : "";
  return { key: "timezone", label: "Stated location vs. activity", value: `${where}; sessions peak around ${hourLabel(h)} local${note}`, level };
}

function photoSignal(deep) {
  const n = deep.photoMatches || 0;
  if (n >= 5) return { key: "photo", label: "Profile image match", value: `this image appears on ${n} other, unrelated profiles — a stock-library match`, level: "high" };
  if (n > 0) return { key: "photo", label: "Profile image match", value: `appears on ${n} other profile${n === 1 ? "" : "s"} — could be a shared or family photo`, level: "medium" };
  return { key: "photo", label: "Profile image match", value: "no matches elsewhere", level: "low" };
}

function recordSignal(deep, account) {
  const rec = parseMonthYear(deep.recordCreated);
  if (!rec) return { key: "record", label: "Account record", value: `server record consistent with "Joined ${account.joined || "unknown"}"`, level: "low" };
  const before = rec.year < ALGO_LAUNCH.year || (rec.year === ALGO_LAUNCH.year && rec.month < ALGO_LAUNCH.month);
  if (!before) return { key: "record", label: "Account record", value: `server record created ${deep.recordCreated}`, level: "low" };
  const months = (ALGO_LAUNCH.year - rec.year) * 12 + (ALGO_LAUNCH.month - rec.month);
  const span = months >= 24 ? `${Math.floor(months / 12)} years` : `${months} months`;
  return { key: "record", label: "Account record", value: `server record created ${deep.recordCreated} — ${span} before ALGO// launched (${ALGO_LAUNCH.label})`, level: "high" };
}

// Engagement history vs. what the account posts publicly. Each engagement
// item carries a `tone` assigned at generation time from what it actually
// IS relative to this account ("aligned": its own interests/its own
// network; "offtopic": unrelated but ordinary; "inflammatory": outrage/
// conspiracy content from outside the network; "cluster": another account's
// post, liked in a burst). The readout just counts them.
function summarizeEngagement(list) {
  const items = list || [];
  const total = items.length;
  const aligned = items.filter((e) => e.tone === "aligned").length;
  const inflammatory = items.filter((e) => e.tone === "inflammatory").length;
  const byMinute = {};
  items.forEach((e) => {
    if (e.kind !== "searched") byMinute[e.minsAgo] = (byMinute[e.minsAgo] || 0) + 1;
  });
  const burst = Math.max(0, ...Object.values(byMinute));
  return { total, aligned, inflammatory, burst };
}

function engagementSignal(deep) {
  const s = summarizeEngagement(deep.engagement);
  if (!s.total) return { key: "engagement", label: "Engagement vs. public posts", value: "no engagement on record", level: "medium" };
  const parts = [`${s.aligned} of ${s.total} match what it posts about`];
  if (s.inflammatory) parts.push(`${s.inflammatory} inflammatory`);
  if (s.burst >= 3) parts.push(`${s.burst} reactions in the same minute`);
  const ratio = s.aligned / s.total;
  const level = s.burst >= 3 || s.inflammatory >= 3 || ratio < 0.34 ? "high" : ratio < 0.67 || s.inflammatory >= 1 ? "medium" : "low";
  return { key: "engagement", label: "Engagement vs. public posts", value: parts.join(" · "), level };
}

// Follow reciprocity, one level deeper than the Connections panel's raw
// lists: how many of the accounts this one follows follow it back. Real
// people's follows are mostly mutual; an account that follows and is never
// followed back is reaching, not socialising. (A self-following cluster
// reads as mutual here — which is exactly why it's a soft signal.)
function reciprocitySignal(account, followerIds) {
  const following = account.following || [];
  if (!following.length) return { key: "reciprocity", label: "Follow reciprocity", value: `follows no one; followed by ${followerIds.length}`, level: followerIds.length ? "medium" : "low" };
  const back = following.filter((id) => followerIds.indexOf(id) !== -1).length;
  const ratio = back / following.length;
  // Only reaching out with NOTHING coming back — no returned follows and no
  // followers at all — reads high. Plenty of real people follow a few
  // accounts that don't follow back; they still have someone following them.
  const level = back === 0 && !followerIds.length ? "high" : back === 0 || ratio < 0.5 ? "medium" : "low";
  return { key: "reciprocity", label: "Follow reciprocity", value: `${back} of ${following.length} follows returned; followed by ${followerIds.length}`, level };
}

// `followerIds`: ids of the accounts (in the same world) that follow this
// one — passed in rather than looked up, so this file stays free of any
// world/roster state.
function computeDeepSignals(account, followerIds) {
  const deep = account.deep || {};
  return [
    timezoneSignal(deep, account),
    photoSignal(deep),
    recordSignal(deep, account),
    engagementSignal(deep),
    reciprocitySignal(account, followerIds || []),
  ].filter(Boolean);
}

const api = { computeSignals, computeDeepSignals, summarizeEngagement, formatUtcOffset, ALGO_LAUNCH };

if (typeof module !== "undefined" && module.exports) {
  module.exports = api;
} else {
  window.SKRAPERS_INVESTIGATE = api;
}

})();

</script>

<script>
// SKRAPERS — Stage 6
// Seeded procedural world generation: same world ID -> same accounts,
// personalities, relationships and posts, every time (doc section 17-18).
//
// Determinism approach, worth being honest about: rather than threading a
// seeded RNG through every function in generate.js and accounts.js's
// timing logic, this scopes a deterministic PRNG onto Math.random for the
// duration of generation, then restores the original. That's a pragmatic
// shortcut for a prototype stage, not how the real thing should work
// long-term (a global patch is fragile if generation ever runs
// concurrently with anything else reading Math.random) — flagged here
// rather than hidden, per the roadmap's own execution notes about not
// letting shortcuts go unrecorded.

(function () {

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hashSeed(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return (h ^ (h >>> 16)) >>> 0;
}

function randomWorldId(rngSource) {
  const digits = "0123456789";
  let s = "SKR-";
  for (let i = 0; i < 6; i++) s += digits[Math.floor((rngSource || Math.random)() * 10)];
  return s;

];
// Content round (28 new HUMAN archetypes, data/personalities.js): this was
// a hardcoded list, NOT Object.keys(HUMAN_PERSONALITIES) — confirmed by
// reading this file before adding new personalities, per the round's own
// instruction not to assume. small_biz is intentionally left out of this
// list; it's selected separately below (SMALL_BIZ_CHANCE / forcedSmallBizIdx)
// because it has its own follower-count override and promo-post behavior.
const HUMAN_KEYS = [
  "lurker", "obsessive", "teenager", "news_follower", "professional",
  "confused_elder", "grumpy_traditionalist", "overexplaining_elder",

  "student", "new_parent", "retiree_traveler", "between_jobs",
